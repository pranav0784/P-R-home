<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum WhatsApp - Secure Room</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-panel: #111b21;
            --wa-header: #202c33;
            --wa-green: #00a884;
            --wa-bubble-sent: #005c4b;
            --wa-bubble-recv: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--wa-bg); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

        /* लॉगिन ओवरले */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--wa-bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: var(--wa-panel); padding: 30px; border-radius: 12px; width: 340px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        .auth-card h2 { color: var(--wa-green); margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2a3942; color: #fff; outline: none; margin-bottom: 12px; }
        .auth-card button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--wa-green); color: #fff; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .app-container { width: 100vw; height: 100vh; display: none; flex-direction: row; overflow: hidden; }

        .sidebar { width: 320px; background: var(--wa-panel); border-right: 1px solid #222d34; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { height: 60px; background: var(--wa-header); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        
        /* एडमिन के लिए कोड जनरेट करने वाला पैनल */
        .admin-panel-box { padding: 12px; background: #182229; border-bottom: 1px solid #222d34; display: none; }
        .admin-panel-box input { width: 100%; padding: 8px; border-radius: 6px; border: none; background: #2a3942; color: #fff; margin-bottom: 6px; outline: none; }
        .admin-panel-box button { width: 100%; padding: 8px; background: var(--wa-green); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }

        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .user-item:hover, .user-item.active { background: #202c33; }
        .online-dot { width: 10px; height: 10px; background: var(--wa-green); border-radius: 50%; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; min-width: 0; }
        .chat-header { height: 60px; background: var(--wa-header); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
        .call-btns { display: flex; gap: 15px; font-size: 1.3rem; cursor: pointer; }

        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; position: relative; }
        .msg.sent { align-self: flex-end; background: var(--wa-bubble-sent); }
        .msg.recv { align-self: flex-start; background: var(--wa-bubble-recv); }
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .time { font-size: 0.65rem; color: var(--text-secondary); text-align: right; margin-top: 4px; }

        .chat-input { height: 62px; background: var(--wa-header); padding: 10px; display: flex; align-items: center; gap: 8px; }
        .input-box { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #2a3942; color: #fff; outline: none; }
        .btn-icon { background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; }

        .call-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:100; padding: 15px; }
        .video-box { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 600px; }
        video { width: 100%; max-width: 260px; height: 190px; background: #222; border-radius: 12px; object-fit: cover; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 35vh; }
            .chat-main { height: 65vh; }
            video { max-width: 140px; height: 170px; }
        }
    </style>
</head>
<body>

    <!-- लॉगिन स्क्रीन -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>Quantum WhatsApp</h2>
            <input type="text" id="inputName" placeholder="Your Name">
            <input type="password" id="inputAdminOrRoomCode" placeholder="Enter Admin Code or Room Code">
            <button onclick="login()">Join Chat</button>
        </div>
    </div>

    <!-- मुख्य ऐप इंटरफ़ेस -->
    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="sidebar-header">
                <strong style="color:var(--wa-green)" id="userRoleTitle">Quantum WhatsApp</strong>
            </div>
            
            <!-- एडमिन के लिए नया कोड सेट करने का पैनल -->
            <div class="admin-panel-box" id="adminPanelBox">
                <div style="font-size:0.75rem; color:var(--wa-green); margin-bottom:4px;">ADMIN CONTROLS:</div>
                <input type="text" id="newRoomCodeInput" placeholder="Set New Entry Code">
                <button onclick="updateRoomCode()">Update Entry Code</button>
            </div>

            <div style="padding:10px; font-size:0.85rem; color:var(--text-secondary);">ONLINE USERS:</div>
            <div class="user-list" id="usersContainer"></div>
        </div>

        <div class="chat-main">
            <div class="chat-header">
                <div>
                    <strong id="targetUserName">Select a user to chat</strong>
                    <div id="targetStatus" style="font-size:0.75rem; color:var(--text-secondary);">Offline</div>
                </div>
                <div class="call-btns" id="callBtns" style="display:none;">
                    <span onclick="startCall('audio')">📞</span>
                    <span onclick="startCall('video')">📹</span>
                </div>
            </div>

            <div class="chat-body" id="chatWin"></div>

            <div class="chat-input">
                <button class="btn-icon" onclick="addEmoji('😊')">😊</button>
                <button class="btn-icon" onclick="document.getElementById('imgInput').click()">📎</button>
                <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendPhoto(this)">
                <input type="text" id="msgText" class="input-box" style="margin:0; flex:1;" placeholder="Type a message..." oninput="handleTyping()" onkeydown="if(event.key==='Enter') sendText()">
                <button class="btn-icon" style="color:var(--wa-green);" onclick="sendText()">➔</button>
            </div>
        </div>
    </div>

    <!-- कॉल स्क्रीन -->
    <div class="call-screen" id="callScreen">
        <h3 id="callTitle" style="margin-bottom:15px; color:#fff;">Calling...</h3>
        <div class="video-box">
            <video id="localVideo" autoplay muted></video>
            <video id="remoteVideo" autoplay></video>
        </div>
        <button onclick="endCall()" style="padding:10px 20px; background:red; color:#fff; border:none; border-radius:20px; font-weight:bold; cursor:pointer;">End Call</button>
    </div>

    <script>
        const socket = io();
        let myName = '', isAdmin = false, selectedTargetSocketId = null, localStream = null, typingTimeout = null;

        function login() {
            myName = document.getElementById('inputName').value.trim();
            const code = document.getElementById('inputAdminOrRoomCode').value.trim();
            if(!myName) return alert('Please enter your name!');

            socket.emit('login-attempt', { username: myName, inputCode: code });
        }

        socket.on('login-success', (data) => {
            isAdmin = data.isAdmin;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('userRoleTitle').innerText = isAdmin ? 'Admin 👑' : 'WhatsApp';
            
            if(isAdmin) {
                document.getElementById('adminPanelBox').style.display = 'block';
            }
        });

        socket.on('login-failed', (msg) => {
            alert(msg);
        });

        function updateRoomCode() {
            const newCode = document.getElementById('newRoomCodeInput').value.trim();
            if(!newCode) return alert('Enter a valid code!');
            socket.emit('set-room-code', { newCode });
            alert('Room entry code updated successfully!');
            document.getElementById('newRoomCodeInput').value = '';
        }

        socket.on('update-user-list', (users) => {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '';
            users.forEach(u => {
                if(u.socketId !== socket.id) {
                    const div = document.createElement('div');
                    div.className = `user-item ${selectedTargetSocketId === u.socketId ? 'active' : ''}`;
                    div.innerHTML = `<span>${u.username} ${u.isAdmin ? '👑' : ''}</span><div class="online-dot"></div>`;
                    div.onclick = () => selectUser(u.socketId, u.username);
                    container.appendChild(div);
                }
            });
        });

        function selectUser(targetId, targetName) {
            selectedTargetSocketId = targetId;
            document.getElementById('targetUserName').innerText = targetName;
            document.getElementById('targetStatus').innerText = 'Online';
            document.getElementById('targetStatus').style.color = 'var(--wa-green)';
            document.getElementById('callBtns').style.display = 'flex';
        }

        function sendText() {
            const txt = document.getElementById('msgText').value.trim();
            if(!txt || !selectedTargetSocketId) return;
            
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            socket.emit('send-private-message', {
                targetSocketId: selectedTargetSocketId,
                message: txt,
                senderName: myName,
                mediaType: 'text'
            });

            renderMsg({ senderName: 'You', message: txt, mediaType: 'text', time: timeStr }, true);
            document.getElementById('msgText').value = '';
        }

        function sendPhoto(input) {
            if (input.files && input.files[0] && selectedTargetSocketId) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    socket.emit('send-private-message', {
                        targetSocketId: selectedTargetSocketId,
                        senderName: myName,
                        mediaType: 'image',
                        mediaUrl: e.target.result
                    });
                    renderMsg({ senderName: 'You', mediaType: 'image', mediaUrl: e.target.result, time: timeStr }, true);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleTyping() {
            if(!selectedTargetSocketId) return;
            socket.emit('typing', { targetSocketId: selectedTargetSocketId, isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { targetSocketId: selectedTargetSocketId, isTyping: false });
            }, 1500);
        }

        socket.on('user-typing', (data) => {
            if(data.fromSocketId === selectedTargetSocketId) {
                const statusDiv = document.getElementById('targetStatus');
                statusDiv.innerText = data.isTyping ? 'typing...' : 'Online';
            }
        });

        socket.on('receive-private-message', (data) => renderMsg(data, false));

        function renderMsg(data, isMe) {
            const win = document.getElementById('chatWin');
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'sent' : 'recv'}`;
            
            let contentHtml = `<strong>${isMe ? 'You' : data.senderName}:</strong><br>`;
            if(data.mediaType === 'text') contentHtml += data.message;
            else if(data.mediaType === 'image') contentHtml += `<img src="${data.mediaUrl}">`;
            
            contentHtml += `<div class="time">${data.time || ''}</div>`;
            div.innerHTML = contentHtml;
            
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        function addEmoji(e) { document.getElementById('msgText').value += e; }

        async function startCall(type) {
            if(!selectedTargetSocketId) return;
            document.getElementById('callScreen').style.display = 'flex';
            document.getElementById('callTitle').innerText = `Calling...`;
            localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            socket.emit('initiate-call', { targetSocketId: selectedTargetSocketId, callType: type, callerName: myName });
        }

        function endCall() {
            document.getElementById('callScreen').style.display = 'none';
            if(localStream) localStream.getTracks().forEach(track => track.stop());
            if(selectedTargetSocketId) socket.emit('end-call', { targetSocketId: selectedTargetSocketId });
        }

        socket.on('call-ended', () => { alert('Call Ended'); endCall(); });
    </script>
</body>
</html>
