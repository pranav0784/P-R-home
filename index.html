<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat App Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { height: 100%; width: 100%; background: #0b141a; color: #e9edef; overflow: hidden; }

        /* Auth Screen */
        #auth-container { position: fixed; inset: 0; background: #111b21; display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .auth-box { background: #202c33; padding: 25px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .auth-box h2 { margin-bottom: 15px; color: #00a884; }
        .auth-box input { width: 100%; margin-top: 12px; padding: 12px 15px; border-radius: 8px; border: 1px solid #2a3942; background: #111b21; color: #fff; font-size: 15px; outline: none; }
        .auth-box button { width: 100%; margin-top: 18px; padding: 12px; border-radius: 8px; border: none; background: #00a884; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* App Layout */
        #app-container { display: flex; width: 100vw; height: 100vh; background: #0b141a; }
        #sidebar { width: 100%; max-width: 320px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; }
        @media (max-width: 600px) {
            #sidebar { width: 100%; display: flex; }
            #chat-area { display: none; width: 100%; }
            body.in-chat #sidebar { display: none; }
            body.in-chat #chat-area { display: flex; }
        }
        .sidebar-header { padding: 16px; background: #202c33; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; color: #e9edef; }
        #user-list { list-style: none; overflow-y: auto; flex: 1; }
        #user-list li { padding: 12px 16px; border-bottom: 1px solid #1f2c33; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        #user-list li:hover { background: #202c33; }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #2a3942; }
        .user-info { flex: 1; }
        .user-name { font-weight: 600; font-size: 16px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #8696a0; }
        .status-dot.online { background: #00a884; }

        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; background-image: radial-gradient(#1f2c33 1px, transparent 0); background-size: 24px 24px; position: relative; }
        .chat-header { padding: 10px 16px; background: #202c33; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
        .chat-header-user { display: flex; align-items: center; gap: 12px; }
        .back-btn { display: none; font-size: 20px; cursor: pointer; color: #aebac1; margin-right: 8px; }
        @media (max-width: 600px) { .back-btn { display: block; } }
        .header-actions { display: flex; gap: 18px; font-size: 18px; color: #aebac1; }
        .header-actions i { cursor: pointer; }

        #messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        /* Message Bubbles & Ticks */
        .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; position: relative; word-wrap: break-word; background: #202c33; align-self: flex-start; color: #e9edef; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .message.my-msg { background: #005c4b; align-self: flex-end; }
        .msg-sender { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #00a884; }
        .my-msg .msg-sender { display: none; }
        .msg-time { font-size: 11px; color: #8696a0; text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; align-items: center; }
        .tick-icon { font-size: 13px; color: #8696a0; }
        .tick-icon.delivered { color: #8696a0; }
        .tick-icon.read { color: #53bdeb; }

        .msg-media { max-width: 100%; max-height: 280px; border-radius: 8px; margin-top: 4px; cursor: pointer; object-fit: cover; }
        .view-once-badge { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,0.3); border-radius: 8px; cursor: pointer; color: #00a884; font-weight: bold; }

        /* Camera & Emoji Popups */
        #camera-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2100; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
        #camera-video { width: 90%; max-width: 400px; border-radius: 12px; background: #000; }
        .cam-btn { padding: 12px 24px; background: #00a884; color: #fff; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }

        #emoji-picker { display: none; position: absolute; bottom: 70px; left: 15px; background: #202c33; border: 1px solid #2a3942; border-radius: 12px; padding: 10px; width: 280px; max-height: 180px; overflow-y: auto; grid-template-columns: repeat(6, 1fr); gap: 8px; z-index: 1200; }
        #emoji-picker span { font-size: 20px; cursor: pointer; text-align: center; }

        /* AI Suggestion Bar */
        #ai-suggestion-bar { display: none; padding: 6px 12px; background: #182229; border-top: 1px solid #222d34; font-size: 13px; gap: 8px; overflow-x: auto; white-space: nowrap; }
        .ai-chip { background: #202c33; padding: 4px 10px; border-radius: 14px; color: #00a884; border: 1px solid #00a884; cursor: pointer; display: inline-block; }

        /* Input Bar */
        .chat-input-bar { padding: 10px 12px; background: #202c33; display: flex; align-items: center; gap: 6px; }
        .icon-btn { background: none; border: none; color: #8696a0; font-size: 19px; cursor: pointer; padding: 6px; display: flex; justify-content: center; align-items: center; }
        .icon-btn.active { color: #00a884; }
        .input-wrapper { flex: 1; background: #2a3942; border-radius: 24px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
        .input-wrapper input { flex: 1; background: none; border: none; padding: 10px 0; color: #fff; font-size: 15px; outline: none; }
        .send-btn { background: #00a884; color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 18px; }

        /* Lightbox & Whiteboard */
        #image-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        #image-modal img, #image-modal video { max-width: 100%; max-height: 75vh; object-fit: contain; }
        .modal-top-bar { width: 100%; display: flex; justify-content: space-between; color: #fff; font-size: 22px; }
        .download-btn { background: #00a884; color: #fff; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; }

        #whiteboard-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1500; justify-content: center; align-items: center; }
        .wb-container { background: #202c33; padding: 15px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; }
        canvas { border: 1px solid #3b4a54; background: #ffffff; border-radius: 8px; touch-action: none; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="auth-container">
        <div class="auth-box">
            <h2>Welcome Chat Pro</h2>
            <input type="text" id="username-input" placeholder="Enter Username">
            <input type="password" id="passcode-input" placeholder="Enter Passcode">
            <button onclick="login()">Start Chat</button>
        </div>
    </div>

    <!-- Workspace -->
    <div id="app-container">
        <div id="sidebar">
            <div class="sidebar-header">
                <span>Chats</span>
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <ul id="user-list"></ul>
        </div>

        <div id="chat-area">
            <div class="chat-header">
                <div class="chat-header-user">
                    <i class="fa-solid fa-arrow-left back-btn" onclick="goBackToUserList()"></i>
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=default" id="active-avatar" class="user-avatar">
                    <div>
                        <div id="active-chat-title" class="user-name">Select User</div>
                        <div id="active-user-status" style="font-size: 12px; color: #8696a0;">Offline</div>
                    </div>
                </div>
                <div class="header-actions">
                    <i class="fa-solid fa-wand-magic-sparkles" onclick="triggerAISuggestions()" title="AI Reply Suggestion"></i>
                    <i class="fa-solid fa-palette" onclick="openWhiteboard()" title="Live Whiteboard"></i>
                </div>
            </div>

            <div id="messages-container"></div>

            <!-- AI Quick Reply Bar -->
            <div id="ai-suggestion-bar"></div>

            <!-- Emoji Picker Window -->
            <div id="emoji-picker"></div>

            <!-- Input Bar -->
            <div class="chat-input-bar">
                <button class="icon-btn" onclick="toggleEmojiPicker()"><i class="fa-regular fa-face-smile"></i></button>
                <input type="file" id="file-input" accept="image/*,video/*" style="display: none;" onchange="handleFileUpload(event)">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                <button class="icon-btn" onclick="openCamera()"><i class="fa-solid fa-camera"></i></button>
                <button class="icon-btn" id="voice-record-btn" onclick="toggleVoiceRecording()"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" id="view-once-btn" onclick="toggleViewOnce()" title="View Once Mode"><i class="fa-solid fa-1"></i></button>
                
                <div class="input-wrapper">
                    <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleTyping()" onkeypress="handleKeyPress(event)">
                </div>

                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Camera Overlay -->
    <div id="camera-modal">
        <video id="camera-video" autoplay playsinline></video>
        <div style="display:flex; gap:15px;">
            <button class="cam-btn" onclick="captureCameraPhoto()">📸 Capture & Send</button>
            <button class="cam-btn" style="background:#dc3545;" onclick="closeCamera()">✕ Close</button>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="image-modal">
        <div class="modal-top-bar">
            <span>Media View</span>
            <i class="fa-solid fa-xmark" onclick="closeImageModal()" style="cursor: pointer;"></i>
        </div>
        <div id="media-preview-container"></div>
        <a id="download-media-btn" href="" download class="download-btn"><i class="fa-solid fa-download"></i> Download</a>
    </div>

    <!-- Whiteboard Modal -->
    <div id="whiteboard-modal">
        <div class="wb-container">
            <div style="display:flex; gap:10px; color:#fff;">
                <input type="color" id="wb-color" value="#000000">
                <input type="range" id="wb-size" min="1" max="20" value="3">
                <button onclick="clearCanvas(true)">🧹 Clear</button>
                <button onclick="closeWhiteboard()" style="background:#dc3545;">✕ Close</button>
            </div>
            <canvas id="paint-board" width="340" height="420"></canvas>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let currentUser = localStorage.getItem('chat_username') || null;
        let selectedTargetUser = null;
        let isViewOnce = false;
        let currentSelectedMedia = null;
        let mediaType = null; // 'image', 'video', 'audio'
        let typingTimeout = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecordingAudio = false;

        let localChatHistory = JSON.parse(localStorage.getItem('chat_history') || '[]');

        const emojis = ["😀","😂","😍","🥰","😎","👍","❤️","🙏","🔥","🎉","🎉","😊","😭","🏻","🙌","✨","💯","🤔","😴","🥳","👌","👏","⚡"];

        window.onload = () => {
            if (currentUser) document.getElementById('username-input').value = currentUser;
            initEmojiPicker();
        };

        function initEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            picker.innerHTML = '';
            emojis.forEach(e => {
                const span = document.createElement('span');
                span.innerText = e;
                span.onclick = () => {
                    document.getElementById('msg-input').value += e;
                };
                picker.appendChild(span);
            });
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        function saveChatsToLocal(msg) {
            const idx = localChatHistory.findIndex(m => m.msgId === msg.msgId);
            if(idx >= 0) localChatHistory[idx] = msg;
            else localChatHistory.push(msg);
            localStorage.setItem('chat_history', JSON.stringify(localChatHistory));
        }

        function login() {
            const username = document.getElementById('username-input').value.trim();
            const inputCode = document.getElementById('passcode-input').value.trim();
            if (!username) return alert('Enter a valid username!');
            socket.emit('login-attempt', { username, inputCode });
        }

        socket.on('login-success', (data) => {
            currentUser = data.username;
            localStorage.setItem('chat_username', currentUser);
            document.getElementById('auth-container').style.display = 'none';
        });

        socket.on('login-failed', (msg) => alert(msg));

        socket.on('update-user-list', (users) => {
            const listEl = document.getElementById('user-list');
            listEl.innerHTML = '';

            users.forEach(u => {
                if (u.username === currentUser) return;

                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${u.avatarUrl}" class="user-avatar">
                    <div class="user-info">
                        <div class="user-name">${u.username}</div>
                    </div>
                    <span class="status-dot ${u.isOnline ? 'online' : ''}"></span>
                `;
                li.onclick = () => selectUser(u.username, u.avatarUrl, u.isOnline, u.lastSeen);
                listEl.appendChild(li);
            });
        });

        function selectUser(username, avatar, isOnline, lastSeen) {
            selectedTargetUser = username;
            document.getElementById('active-chat-title').innerText = username;
            document.getElementById('active-user-status').innerText = isOnline ? 'Online' : (lastSeen || 'Offline');
            document.getElementById('active-avatar').src = avatar;
            
            document.body.classList.add('in-chat');
            loadMessagesForSelectedUser();
            
            // Mark unread messages as read
            socket.emit('mark-read', { senderName: selectedTargetUser, receiverName: currentUser });
        }

        function goBackToUserList() {
            document.body.classList.remove('in-chat');
        }

        function handleTyping() {
            if (!selectedTargetUser) return;
            socket.emit('typing', { targetName: selectedTargetUser, isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { targetName: selectedTargetUser, isTyping: false });
            }, 1500);
        }

        socket.on('user-typing-status', (data) => {
            if (data.fromUser === selectedTargetUser) {
                const statusEl = document.getElementById('active-user-status');
                if (data.isTyping) statusEl.innerText = "typing...";
                else statusEl.innerText = "Online";
            }
        });

        function toggleViewOnce() {
            isViewOnce = !isViewOnce;
            document.getElementById('view-once-btn').classList.toggle('active', isViewOnce);
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const message = input.value.trim();

            if ((!message && !currentSelectedMedia) || !selectedTargetUser) return;

            const msgData = {
                senderName: currentUser,
                targetName: selectedTargetUser,
                message: message,
                mediaUrl: currentSelectedMedia,
                mediaType: mediaType,
                isViewOnce: isViewOnce
            };

            socket.emit('send-private-message', msgData);

            input.value = '';
            currentSelectedMedia = null;
            mediaType = null;
            document.getElementById('emoji-picker').style.display = 'none';
            if (isViewOnce) toggleViewOnce();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('receive-private-message', (msg) => {
            saveChatsToLocal(msg);
            if (
                (msg.senderName === currentUser && msg.targetName === selectedTargetUser) ||
                (msg.senderName === selectedTargetUser && msg.targetName === currentUser)
            ) {
                renderSingleMessage(msg);
                if (msg.targetName === currentUser) {
                    socket.emit('mark-read', { senderName: msg.senderName, receiverName: currentUser });
                }
            }
        });

        socket.on('messages-status-update', ({ msgIds, status }) => {
            localChatHistory.forEach(m => {
                if (msgIds.includes(m.msgId)) m.status = status;
            });
            localStorage.setItem('chat_history', JSON.stringify(localChatHistory));
            if (selectedTargetUser) loadMessagesForSelectedUser();
        });

        function loadMessagesForSelectedUser() {
            const box = document.getElementById('messages-container');
            box.innerHTML = '';
            
            const filtered = localChatHistory.filter(m => 
                (m.senderName === currentUser && m.targetName === selectedTargetUser) ||
                (m.senderName === selectedTargetUser && m.targetName === currentUser)
            );

            filtered.forEach(renderSingleMessage);
            box.scrollTop = box.scrollHeight;
        }

        function renderSingleMessage(msg) {
            const box = document.getElementById('messages-container');
            let div = document.getElementById(`msg-${msg.msgId}`);
            if (!div) {
                div = document.createElement('div');
                div.id = `msg-${msg.msgId}`;
                box.appendChild(div);
            }

            const isMe = msg.senderName === currentUser;
            div.className = `message ${isMe ? 'my-msg' : ''}`;

            let contentHTML = `<div class="msg-sender">${msg.senderName}</div>`;

            if (msg.mediaUrl) {
                if (msg.isViewOnce) {
                    contentHTML += `
                        <div class="view-once-badge" onclick="openViewOnceMedia('${msg.msgId}', '${msg.mediaUrl}', '${msg.mediaType}')">
                            <i class="fa-solid fa-circle-notch"></i> View Once ${msg.mediaType || 'Media'}
                        </div>`;
                } else {
                    if (msg.mediaType === 'video') {
                        contentHTML += `<video src="${msg.mediaUrl}" class="msg-media" controls></video>`;
                    } else if (msg.mediaType === 'audio') {
                        contentHTML += `<audio src="${msg.mediaUrl}" controls style="max-width:200px; margin-top:5px;"></audio>`;
                    } else {
                        contentHTML += `<img src="${msg.mediaUrl}" class="msg-media" onclick="openMediaModal('${msg.mediaUrl}', 'image')">`;
                    }
                }
            }

            if (msg.message) {
                contentHTML += `<div>${msg.message}</div>`;
            }

            // Ticks status: sent (single grey), delivered (double grey), read (double blue)
            let tickHTML = '';
            if (isMe) {
                if (msg.status === 'read') {
                    tickHTML = `<i class="fa-solid fa-check-double tick-icon read"></i>`;
                } else if (msg.status === 'delivered') {
                    tickHTML = `<i class="fa-solid fa-check-double tick-icon delivered"></i>`;
                } else {
                    tickHTML = `<i class="fa-solid fa-check tick-icon"></i>`;
                }
            }

            contentHTML += `<div class="msg-time">${msg.time || ''} ${tickHTML}</div>`;
            div.innerHTML = contentHTML;
            box.scrollTop = box.scrollHeight;
        }

        // Camera Logic
        let cameraStream = null;
        async function openCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('camera-video').srcObject = cameraStream;
                document.getElementById('camera-modal').style.display = 'flex';
            } catch(e) {
                alert('Camera Access Denied/Unavailable!');
            }
        }

        function captureCameraPhoto() {
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            currentSelectedMedia = canvas.toDataURL('image/jpeg', 0.8);
            mediaType = 'image';
            closeCamera();
            sendMessage();
        }

        function closeCamera() {
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            document.getElementById('camera-modal').style.display = 'none';
        }

        // Voice Recorder Logic
        async function toggleVoiceRecording() {
            const btn = document.getElementById('voice-record-btn');
            if (!isRecordingAudio) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            currentSelectedMedia = reader.result;
                            mediaType = 'audio';
                            sendMessage();
                        };
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    isRecordingAudio = true;
                    btn.classList.add('active');
                } catch(e) {
                    alert('Microphone Access Denied!');
                }
            } else {
                mediaRecorder.stop();
                isRecordingAudio = false;
                btn.classList.remove('active');
            }
        }

        // File Attachment
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            mediaType = file.type.startsWith('video') ? 'video' : 'image';
            const reader = new FileReader();
            reader.onload = function(evt) {
                currentSelectedMedia = evt.target.result;
                sendMessage();
            };
            reader.readAsDataURL(file);
        }

        // Smart AI Auto-Reply Suggestions
        function triggerAISuggestions() {
            const bar = document.getElementById('ai-suggestion-bar');
            bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
            bar.innerHTML = `
                <span class="ai-chip" onclick="applyAISuggestion('हाहा, ठीक है!')">हाहा, ठीक है!</span>
                <span class="ai-chip" onclick="applyAISuggestion('मैं अभी थोड़ा व्यस्त हूँ, बाद में बात करते हैं।')">व्यस्त हूँ</span>
                <span class="ai-chip" onclick="applyAISuggestion('ज़रूर, मुझे यह पसंद आया!')">पसंद आया</span>
            `;
        }

        function applyAISuggestion(text) {
            document.getElementById('msg-input').value = text;
            document.getElementById('ai-suggestion-bar').style.display = 'none';
        }

        // Lightbox
        function openMediaModal(url, type) {
            const container = document.getElementById('media-preview-container');
            if (type === 'video') container.innerHTML = `<video src="${url}" controls autoplay></video>`;
            else container.innerHTML = `<img src="${url}">`;
            
            document.getElementById('download-media-btn').href = url;
            document.getElementById('image-modal').style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('image-modal').style.display = 'none';
        }

        function openViewOnceMedia(msgId, url, type) {
            openMediaModal(url, type);
            localChatHistory = localChatHistory.filter(m => m.msgId !== msgId);
            localStorage.setItem('chat_history', JSON.stringify(localChatHistory));
        }

        // Whiteboard Logic
        const canvas = document.getElementById('paint-board');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, lastX = 0, lastY = 0;

        function openWhiteboard() {
            if (!selectedTargetUser) return alert('Select a user first!');
            document.getElementById('whiteboard-modal').style.display = 'flex';
        }

        function closeWhiteboard() {
            document.getElementById('whiteboard-modal').style.display = 'none';
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const p = getPos(e);
            const color = document.getElementById('wb-color').value;
            const size = document.getElementById('wb-size').value;
            
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.stroke();
            
            socket.emit('wb-draw-data', { targetName: selectedTargetUser, x0: lastX, y0: lastY, x1: p.x, y1: p.y, color, size });
            lastX = p.x; lastY = p.y;
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);

        socket.on('wb-draw-receive', (d) => {
            ctx.beginPath(); ctx.moveTo(d.x0, d.y0); ctx.lineTo(d.x1, d.y1);
            ctx.strokeStyle = d.color; ctx.lineWidth = d.size; ctx.lineCap = 'round'; ctx.stroke();
        });

        function clearCanvas(emit) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (emit && selectedTargetUser) socket.emit('wb-clear-data', { targetName: selectedTargetUser });
        }
        socket.on('wb-clear-receive', () => clearCanvas(false));
    </script>
</body>
</html>
