<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Messenger Pro</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --header-bg: #202c33;
            --input-bg: #2a3942;
            --accent-green: #00a884;
            --msg-out: #005c4b;
            --msg-in: #202c33;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --border-color: #222d34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { height: 100%; width: 100%; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

        /* Auth Screen */
        #auth-container {
            position: fixed; inset: 0; background: var(--panel-bg);
            display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .auth-box { background: var(--header-bg); padding: 25px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .auth-box h2 { margin-bottom: 15px; color: var(--accent-green); }
        .auth-box input { width: 100%; margin-top: 12px; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--input-bg); background: var(--panel-bg); color: #fff; font-size: 15px; outline: none; }
        .auth-box button { width: 100%; margin-top: 18px; padding: 12px; border-radius: 8px; border: none; background: var(--accent-green); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* App Layout */
        #app-container { display: flex; width: 100vw; height: 100vh; background: var(--bg-dark); }
        
        /* Sidebar / User List */
        #sidebar { width: 100%; max-width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        @media (max-width: 600px) {
            #sidebar { width: 100%; display: flex; }
            #chat-area { display: none; width: 100%; }
            body.in-chat #sidebar { display: none; }
            body.in-chat #chat-area { display: flex; }
        }
        .sidebar-header { padding: 16px; background: var(--header-bg); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; color: var(--text-main); }
        #user-list { list-style: none; overflow-y: auto; flex: 1; }
        #user-list li { padding: 12px 16px; border-bottom: 1px solid #1f2c33; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        #user-list li:hover { background: var(--header-bg); }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--input-bg); }
        .user-info { flex: 1; }
        .user-name { font-weight: 600; font-size: 16px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-sub); }
        .status-dot.online { background: var(--accent-green); }

        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); background-image: radial-gradient(#1f2c33 1px, transparent 0); background-size: 24px 24px; position: relative; }
        .chat-header { padding: 10px 16px; background: var(--header-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--input-bg); }
        .chat-header-user { display: flex; align-items: center; gap: 12px; }
        .back-btn { display: none; font-size: 20px; cursor: pointer; color: #aebac1; margin-right: 8px; }
        @media (max-width: 600px) { .back-btn { display: block; } }

        .header-actions { display: flex; gap: 18px; font-size: 18px; color: #aebac1; }
        .header-actions i { cursor: pointer; }
        .header-actions i:hover { color: var(--accent-green); }

        #messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        /* Message Bubbles */
        .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; position: relative; word-wrap: break-word; background: var(--msg-in); align-self: flex-start; color: var(--text-main); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .message.my-msg { background: var(--msg-out); align-self: flex-end; }
        .msg-sender { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: var(--accent-green); }
        .my-msg .msg-sender { display: none; }
        .msg-time { font-size: 11px; color: var(--text-sub); text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; align-items: center; }

        .msg-media { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 4px; cursor: pointer; object-fit: cover; }
        .view-once-badge { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,0.3); border-radius: 8px; cursor: pointer; color: var(--accent-green); font-weight: bold; }
        .msg-actions { position: absolute; top: 4px; right: 6px; display: none; cursor: pointer; font-size: 12px; color: var(--text-sub); }
        .message:hover .msg-actions { display: block; }

        /* Typing & AI Quick Reply */
        #typing-status { font-size: 12px; color: var(--accent-green); min-height: 16px; padding: 0 16px 4px 16px; }
        #ai-reply-bar { display: flex; gap: 8px; padding: 6px 12px; background: var(--panel-bg); overflow-x: auto; border-top: 1px solid var(--border-color); }
        .ai-chip { background: var(--input-bg); color: var(--text-main); padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; white-space: nowrap; border: 1px solid var(--border-color); }
        .ai-chip:hover { background: var(--accent-green); }

        /* Bottom Input Bar */
        .chat-input-bar { padding: 10px 12px; background: var(--header-bg); display: flex; align-items: center; gap: 8px; }
        .icon-btn { background: none; border: none; color: var(--text-sub); font-size: 20px; cursor: pointer; padding: 6px; display: flex; justify-content: center; align-items: center; }
        .icon-btn.active { color: var(--accent-green); }
        
        .input-wrapper { flex: 1; background: var(--input-bg); border-radius: 24px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
        .input-wrapper input { flex: 1; background: none; border: none; padding: 10px 0; color: #fff; font-size: 15px; outline: none; }
        
        .send-btn { background: var(--accent-green); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 18px; }

        /* Full Screen Image Lightbox */
        #image-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        #image-modal img { max-width: 100%; max-height: 80vh; object-fit: contain; }
        .modal-top-bar { width: 100%; display: flex; justify-content: space-between; color: #fff; font-size: 22px; }
        .modal-bottom-bar { width: 100%; display: flex; justify-content: center; margin-bottom: 10px; }
        .download-btn { background: var(--accent-green); color: #fff; padding: 12px 24px; border-radius: 30px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        /* Whiteboard Canvas Modal */
        #whiteboard-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1500; justify-content: center; align-items: center; }
        .wb-container { background: var(--header-bg); padding: 15px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; }
        .wb-controls { display: flex; gap: 10px; align-items: center; color: #fff; flex-wrap: wrap; }
        .wb-controls button { padding: 6px 12px; border: none; background: var(--input-bg); color: #fff; border-radius: 6px; cursor: pointer; }
        canvas { border: 1px solid #3b4a54; background: #ffffff; border-radius: 8px; touch-action: none; }

        /* WebRTC Call Container & Draggable PiP Video */
        #call-container { display: none; position: fixed; inset: 0; background: rgba(11,20,26,0.95); z-index: 1800; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        #remote-video { width: 100%; height: 100%; max-width: 800px; max-height: 80vh; border-radius: 12px; background: #000; object-fit: cover; }
        
        #local-video-container {
            position: absolute; top: 30px; right: 30px; width: 120px; height: 160px;
            border-radius: 12px; overflow: hidden; border: 2px solid var(--accent-green);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: grab; z-index: 1900; background: #000;
        }
        #local-video { width: 100%; height: 100%; object-fit: cover; }
        
        .call-controls { display: flex; gap: 20px; margin-bottom: 20px; z-index: 1900; }
        .call-btn { width: 50px; height: 50px; border-radius: 50%; border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .call-btn.end { background: #dc3545; }
        .call-btn.mute { background: var(--input-bg); }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="auth-container">
        <div class="auth-box">
            <h2>Quantum Messenger</h2>
            <input type="text" id="username-input" placeholder="Enter Username">
            <input type="password" id="passcode-input" placeholder="Enter Passcode">
            <button onclick="login()">Start Chat</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container">
        <div id="sidebar">
            <div class="sidebar-header">
                <span>Chats</span>
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <ul id="user-list"></ul>
        </div>

        <div id="chat-area">
            <div class="chat-header">
                <div class="chat-header-user">
                    <i class="fa-solid fa-arrow-left back-btn" onclick="goBackToUserList()"></i>
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=default" id="active-avatar" class="user-avatar">
                    <div>
                        <div id="active-chat-title" class="user-name">Select User</div>
                        <div id="active-user-status" style="font-size: 12px; color: #8696a0;">Offline</div>
                    </div>
                </div>
                <div class="header-actions">
                    <i class="fa-solid fa-palette" onclick="openWhiteboard()" title="Live Whiteboard"></i>
                    <i class="fa-solid fa-phone" onclick="startCall(false)" title="Voice Call"></i>
                    <i class="fa-solid fa-video" onclick="startCall(true)" title="Video Call"></i>
                </div>
            </div>

            <div id="messages-container"></div>
            
            <div id="typing-status"></div>

            <!-- AI Quick Reply Chips -->
            <div id="ai-reply-bar">
                <div class="ai-chip" onclick="useQuickReply('Haan, zaroor! 👍')">Haan, zaroor! 👍</div>
                <div class="ai-chip" onclick="useQuickReply('Abhi thoda busy hu ⌛')">Abhi thoda busy hu ⌛</div>
                <div class="ai-chip" onclick="useQuickReply('Ghar pe hu 🏠')">Ghar pe hu 🏠</div>
                <div class="ai-chip" onclick="useQuickReply('Haan, call karo 📞')">Haan, call karo 📞</div>
            </div>

            <div class="chat-input-bar">
                <button class="icon-btn"><i class="fa-regular fa-face-smile"></i></button>
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                <button class="icon-btn" id="view-once-btn" onclick="toggleViewOnce()" title="View Once Mode"><i class="fa-solid fa-1"></i></button>
                
                <div class="input-wrapper">
                    <input type="text" id="msg-input" placeholder="Type a message..." oninput="emitTyping()" onkeypress="handleKeyPress(event)">
                </div>

                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="image-modal">
        <div class="modal-top-bar">
            <span>Photo</span>
            <i class="fa-solid fa-xmark" onclick="closeImageModal()" style="cursor: pointer;"></i>
        </div>
        <img id="full-image-view" src="" alt="Full Screen Image">
        <div class="modal-bottom-bar">
            <a id="download-image-btn" href="" download="Chat_Photo.jpg" class="download-btn">
                <i class="fa-solid fa-download"></i> Download to Gallery
            </a>
        </div>
    </div>

    <!-- Whiteboard Modal -->
    <div id="whiteboard-modal">
        <div class="wb-container">
            <div class="wb-controls">
                <label>Color: <input type="color" id="wb-color" value="#000000"></label>
                <label>Size: <input type="range" id="wb-size" min="1" max="20" value="3"></label>
                <button onclick="clearCanvas(true)">🧹 Clear</button>
                <button onclick="closeWhiteboard()" style="background:#dc3545;">✕ Close</button>
            </div>
            <canvas id="paint-board" width="340" height="420"></canvas>
        </div>
    </div>

    <!-- WebRTC Call Screen -->
    <div id="call-container">
        <div id="local-video-container">
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <video id="remote-video" autoplay playsinline></video>
        <div class="call-controls">
            <button class="call-btn mute" onclick="toggleAudio()"><i class="fa-solid fa-microphone" id="mic-icon"></i></button>
            <button class="call-btn end" onclick="endCall(true)"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const PUBLIC_VAPID_KEY = 'YOUR_PUBLIC_VAPID_KEY'; // Replace with your VAPID key

        let currentUser = localStorage.getItem('chat_username') || null;
        let selectedTargetUser = null;
        let isViewOnce = false;
        let currentSelectedMedia = null;
        let typingTimeout = null;

        let localChatHistory = JSON.parse(localStorage.getItem('chat_history') || '[]');

        function saveChatsToLocal(msg) {
            localChatHistory.push(msg);
            localStorage.setItem('chat_history', JSON.stringify(localChatHistory));
        }

        window.onload = () => {
            if (currentUser) {
                document.getElementById('username-input').value = currentUser;
            }
            setupDraggablePiP();
        };

        function login() {
            const username = document.getElementById('username-input').value.trim();
            const inputCode = document.getElementById('passcode-input').value.trim();

            if (!username) return alert('Enter a valid username!');
            socket.emit('login-attempt', { username, inputCode });
        }

        socket.on('login-success', (data) => {
            currentUser = data.username;
            localStorage.setItem('chat_username', currentUser);
            document.getElementById('auth-container').style.display = 'none';

            initPushNotifications();
        });

        socket.on('login-failed', (msg) => alert(msg));

        /* Web Push Notification Subscription */
        async function initPushNotifications() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                try {
                    const register = await navigator.serviceWorker.register('/sw.js');
                    const permission = await Notification.requestPermission();
                    
                    if (permission === 'granted') {
                        const subscription = await register.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: urlB64ToUint8Array(PUBLIC_VAPID_KEY)
                        });

                        socket.emit('register-push-subscription', {
                            username: currentUser,
                            subscription: subscription
                        });
                    }
                } catch (err) {
                    console.error('Push Subscription Error:', err);
                }
            }
        }

        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        /* User List Management */
        socket.on('update-user-list', (users) => {
            const listEl = document.getElementById('user-list');
            listEl.innerHTML = '';

            users.forEach(u => {
                if (u.username === currentUser) return;

                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${u.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + u.username}" class="user-avatar">
                    <div class="user-info">
                        <div class="user-name">${u.username}</div>
                    </div>
                    <span class="status-dot ${u.isOnline ? 'online' : ''}"></span>
                `;
                li.onclick = () => selectUser(u.username, u.avatarUrl, u.isOnline);
                listEl.appendChild(li);
            });
        });

        function selectUser(username, avatar, isOnline) {
            selectedTargetUser = username;
            document.getElementById('active-chat-title').innerText = username;
            document.getElementById('active-user-status').innerText = isOnline ? 'Online' : 'Offline';
            document.getElementById('active-avatar').src = avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${username}`;
            
            document.body.classList.add('in-chat');
            loadMessagesForSelectedUser();
        }

        function goBackToUserList() {
            document.body.classList.remove('in-chat');
        }

        function toggleViewOnce() {
            isViewOnce = !isViewOnce;
            const btn = document.getElementById('view-once-btn');
            if (isViewOnce) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function emitTyping() {
            if (!selectedTargetUser) return;
            socket.emit('typing', { targetName: selectedTargetUser, isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { targetName: selectedTargetUser, isTyping: false });
            }, 2000);
        }

        socket.on('display-typing', (data) => {
            if (data.senderName === selectedTargetUser) {
                const el = document.getElementById('typing-status');
                el.innerText = data.isTyping ? `${selectedTargetUser} is typing...` : '';
            }
        });

        function useQuickReply(text) {
            document.getElementById('msg-input').value = text;
            sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const message = input.value.trim();

            if ((!message && !currentSelectedMedia) || !selectedTargetUser) return;

            const msgData = {
                msgId: 'msg_' + Date.now(),
                senderName: currentUser,
                targetName: selectedTargetUser,
                message: message,
                mediaUrl: currentSelectedMedia,
                isViewOnce: isViewOnce,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            socket.emit('send-private-message', msgData);

            input.value = '';
            currentSelectedMedia = null;
            if (isViewOnce) toggleViewOnce();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('receive-private-message', (msg) => {
            saveChatsToLocal(msg);
            if (
                (msg.senderName === currentUser && msg.targetName === selectedTargetUser) ||
                (msg.senderName === selectedTargetUser && msg.targetName === currentUser)
            ) {
                renderSingleMessage(msg);
            }
        });

        function loadMessagesForSelectedUser() {
            const box = document.getElementById('messages-container');
            box.innerHTML = '';
            
            const filtered = localChatHistory.filter(m => 
                (m.senderName === currentUser && m.targetName === selectedTargetUser) ||
                (m.senderName === selectedTargetUser && m.targetName === currentUser)
            );

            filtered.forEach(renderSingleMessage);
            box.scrollTop = box.scrollHeight;
        }

        function renderSingleMessage(msg) {
            const box = document.getElementById('messages-container');
            const div = document.createElement('div');
            const isMe = msg.senderName === currentUser;
            div.className = `message ${isMe ? 'my-msg' : ''}`;
            div.id = `msg-el-${msg.msgId}`;

            let contentHTML = `<div class="msg-sender">${msg.senderName}</div>`;

            if (isMe) {
                contentHTML += `<div class="msg-actions" onclick="deleteMessageEveryone('${msg.msgId}')" title="Delete for everyone"><i class="fa-solid fa-trash"></i></div>`;
            }

            if (msg.mediaUrl) {
                if (msg.isViewOnce) {
                    contentHTML += `
                        <div class="view-once-badge" onclick="openViewOnceMedia('${msg.msgId}', '${msg.mediaUrl}')">
                            <i class="fa-solid fa-circle-notch"></i> Photo (View Once)
                        </div>`;
                } else {
                    contentHTML += `<img src="${msg.mediaUrl}" class="msg-media" onclick="openImageModal('${msg.mediaUrl}')">`;
                }
            }

            if (msg.message) {
                contentHTML += `<div>${msg.message}</div>`;
            }

            contentHTML += `<div class="msg-time">${msg.time || ''} ${isMe ? '<i class="fa-solid fa-check-double"></i>' : ''}</div>`;
            div.innerHTML = contentHTML;

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function deleteMessageEveryone(msgId) {
            if (confirm("Delete message for everyone?")) {
                socket.emit('delete-message-everyone', { msgId, targetName: selectedTargetUser });
            }
        }

        socket.on('message-deleted', (data) => {
            localChatHistory = localChatHistory.filter(m => m.msgId !== data.msgId);
            localStorage.setItem('chat_history', JSON.stringify(localChatHistory));
            const el = document.getElementById(`msg-el-${data.msgId}`);
            if (el) el.remove();
        });

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                currentSelectedMedia = evt.target.result;
                sendMessage();
            };
            reader.readAsDataURL(file);
        }

        function openImageModal(url) {
            document.getElementById('full-image-view').src = url;
            document.getElementById('download-image-btn').href = url;
            document.getElementById('image-modal').style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('image-modal').style.display = 'none';
        }

        function openViewOnceMedia(msgId, url) {
            openImageModal(url);
            localChatHistory = localChatHistory.filter(m => m.msgId !== msgId);
            localStorage.setItem('chat_history', JSON.stringify(localChatHistory));
            const el = document.getElementById(`msg-el-${msgId}`);
            if (el) el.remove();
        }

        /* Live Whiteboard Canvas Logic */
        const canvas = document.getElementById('paint-board');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, lastX = 0, lastY = 0;

        function openWhiteboard() {
            if (!selectedTargetUser) return alert('Select a user first!');
            document.getElementById('whiteboard-modal').style.display = 'flex';
        }

        function closeWhiteboard() {
            document.getElementById('whiteboard-modal').style.display = 'none';
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const p = getPos(e);
            const color = document.getElementById('wb-color').value;
            const size = document.getElementById('wb-size').value;
            
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.stroke();
            
            socket.emit('wb-draw-data', { targetName: selectedTargetUser, x0: lastX, y0: lastY, x1: p.x, y1: p.y, color, size });
            lastX = p.x; lastY = p.y;
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);

        socket.on('wb-draw-receive', (d) => {
            ctx.beginPath(); ctx.moveTo(d.x0, d.y0); ctx.lineTo(d.x1, d.y1);
            ctx.strokeStyle = d.color; ctx.lineWidth = d.size; ctx.lineCap = 'round'; ctx.stroke();
        });

        function clearCanvas(emit) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (emit && selectedTargetUser) socket.emit('wb-clear-data', { targetName: selectedTargetUser });
        }
        socket.on('wb-clear-receive', () => clearCanvas(false));

        /* WebRTC Video / Voice Calling Logic */
        let peerConnection = null;
        let localStream = null;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function startCall(isVideo) {
            if (!selectedTargetUser) return alert("Select a user to call!");
            document.getElementById('call-container').style.display = 'flex';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: isVideo,
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                document.getElementById('local-video').srcObject = localStream;

                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                socket.emit('call-user', { targetName: selectedTargetUser, offer, isVideo });
            } catch (err) {
                console.error("Call Error:", err);
                endCall(false);
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { targetName: selectedTargetUser, candidate: event.candidate });
                }
            };

            peerConnection.ontrack = (event) => {
                document.getElementById('remote-video').srcObject = event.streams[0];
            };
        }

        socket.on('incoming-call', async (data) => {
            if (confirm(`Incoming ${data.isVideo ? 'Video' : 'Voice'} Call from ${data.senderName}. Accept?`)) {
                selectedTargetUser = data.senderName;
                document.getElementById('call-container').style.display = 'flex';

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: data.isVideo,
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                document.getElementById('local-video').srcObject = localStream;

                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('answer-call', { targetName: data.senderName, answer });
            }
        });

        socket.on('call-answered', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('receive-ice-candidate', async (data) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function toggleAudio() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('mic-icon').className = audioTrack.enabled ? 'fa-solid fa-microphone' : 'fa-solid fa-microphone-slash';
            }
        }

        function endCall(emit) {
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            peerConnection = null; localStream = null;
            document.getElementById('call-container').style.display = 'none';

            if (emit && selectedTargetUser) {
                socket.emit('end-call', { targetName: selectedTargetUser });
            }
        }

        socket.on('call-ended', () => endCall(false));

        /* Draggable PiP (Picture-in-Picture) Local Video */
        function setupDraggablePiP() {
            const el = document.getElementById('local-video-container');
            let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

            el.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
                isDragging = true;
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                    xOffset = currentX; yOffset = currentY;
                    el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
                }
            }

            function dragEnd() { isDragging = false; }
        }
    </script>
</body>
</html>
