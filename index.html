<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Messenger Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-dark: #111b21;
            --header-dark: #202c33;
            --accent-green: #00a884;
            --bubble-sent: #005c4b;
            --bubble-recv: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --card-border: #222d34;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; background: var(--bg-dark); color: var(--text-primary); overflow: hidden; }

        #splashScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #0b141a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            animation: fadeOut 0.8s ease 1.5s forwards;
        }

        .alien-logo-badge {
            width: 150px; height: 150px; border-radius: 50%;
            background: linear-gradient(135deg, #1f2c34, #0b141a);
            border: 3px solid var(--accent-green); color: var(--accent-green);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.15rem; font-weight: bold; letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(0, 168, 132, 0.6);
            animation: pulseZoom 1.2s infinite alternate ease-in-out;
            text-shadow: 0 0 10px rgba(0, 255, 180, 0.7); user-select: none;
        }

        .splash-title { color: var(--accent-green); margin-top: 20px; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; }

        @keyframes pulseZoom {
            from { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 168, 132, 0.4); }
            to { transform: scale(1.08); box-shadow: 0 0 35px rgba(0, 168, 132, 0.8); }
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: var(--panel-dark); padding: 25px; border-radius: 16px; width: 90%; max-width: 350px; text-align: center; border: 1px solid var(--card-border); }
        .auth-card h2 { color: var(--accent-green); margin-bottom: 18px; }
        .auth-card input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: #1f2c34; color: #fff; margin-bottom: 12px; outline: none; }
        .auth-card button { width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent-green); color: #fff; font-weight: bold; cursor: pointer; }

        .app-container { width: 100vw; height: 100dvh; display: none; flex-direction: row; overflow: hidden; }

        .sidebar { width: 360px; background: var(--panel-dark); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { height: 60px; background: var(--header-dark); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); }
        .user-profile-badge { display: flex; align-items: center; gap: 12px; }
        .my-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-green); cursor: pointer; }

        .admin-box { padding: 12px; background: #182229; border-bottom: 1px solid var(--card-border); display: none; }
        .admin-box button { width: 100%; padding: 8px; background: var(--accent-green); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; display: flex; align-items: center; gap: 12px; position: relative; }
        .user-item:hover, .user-item.active { background: #202c33; }
        .user-item img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        .user-info { flex: 1; min-width: 0; }
        .user-info strong { display: block; font-size: 0.95rem; color: var(--text-primary); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-info span { font-size: 0.8rem; color: var(--text-secondary); }
        .online-dot { width: 10px; height: 10px; background: var(--accent-green); border-radius: 50%; }
        
        .unread-badge { background: var(--accent-green); color: #000; font-size: 0.75rem; font-weight: bold; padding: 2px 7px; border-radius: 50%; display: inline-block; margin-left: 6px; }

        .kick-btn { background: #ff5252; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); height: 100dvh; min-width: 0; position: relative; }
        .chat-header { height: 60px; background: var(--header-dark); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); flex-shrink: 0; }
        .target-profile { display: flex; align-items: center; gap: 12px; }
        .target-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .header-actions { display: flex; gap: 16px; align-items: center; }

        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#182229 1px, transparent 1px); background-size: 20px 20px; }

        #replyPreviewBar { display: none; background: #1f2c34; border-left: 4px solid var(--accent-green); padding: 8px 12px; margin: 0 12px; border-radius: 6px; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-secondary); }

        .chat-input { height: 62px; background: var(--header-dark); padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; border-top: 1px solid var(--card-border); position: relative; }
        .input-box { flex: 1; padding: 10px 16px; border-radius: 20px; border: none; background: #2a3942; color: #fff; outline: none; font-size: 0.95rem; }
        .btn-icon { background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }

        #emojiBox { display: none; position: absolute; bottom: 68px; left: 10px; background: var(--panel-dark); border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; max-width: 300px; flex-wrap: wrap; gap: 10px; z-index: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #emojiBox span { font-size: 1.5rem; cursor: pointer; user-select: none; transition: transform 0.1s; }
        #emojiBox span:hover { transform: scale(1.2); }

        .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 0.92rem; word-break: break-word; position: relative; cursor: pointer; }
        .msg.sent { align-self: flex-end; background: var(--bubble-sent); }
        .msg.recv { align-self: flex-start; background: var(--bubble-recv); }
        .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 5px; max-height: 250px; cursor: pointer; }
        .msg audio { max-width: 100%; margin-top: 5px; }
        
        .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent-green); padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; font-size: 0.8rem; color: #b0bec5; }
        .time-ticks { font-size: 0.65rem; color: var(--text-secondary); text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
        .blue-ticks { color: #53bdeb; font-weight: bold; }

        .call-log-bubble { align-self: center; background: #1f2c34; border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 12px; font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; margin: 4px 0; }

        #deleteModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; justify-content: center; align-items: center; }
        .delete-card { background: var(--panel-dark); padding: 20px; border-radius: 16px; border: 1px solid var(--card-border); width: 290px; text-align: center; }
        .delete-card button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-reply-action { background: var(--accent-green); color: #fff; }
        .btn-del-everyone { background: #ff5252; color: #fff; }
        .btn-del-me { background: #2a3942; color: #fff; }
        .btn-cancel { background: transparent; color: var(--text-secondary); }

        #callModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000; z-index: 9000; flex-direction: column; justify-content: space-between; align-items: center;
        }

        .video-full-container { position: absolute; top:0; left:0; width:100%; height:100%; overflow:hidden; z-index:1; }
        #mainVideo { width: 100%; height: 100%; object-fit: cover; }
        #pipVideo {
            position: absolute; top: 20px; right: 20px; width: 120px; height: 170px;
            object-fit: cover; border-radius: 12px; border: 2px solid var(--accent-green);
            z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.8); cursor: pointer;
        }

        .call-top-bar {
            position: relative; z-index: 20; width: 100%; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .call-controls-bar {
            position: relative; z-index: 20; width: 100%; padding: 25px 20px;
            display: flex; justify-content: center; gap: 20px; align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .call-btn-circle {
            width: 55px; height: 55px; border-radius: 50%; border: none;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.3rem; cursor: pointer; color: #fff; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px); transition: transform 0.2s;
        }
        .btn-call-end { background: #ff3b30 !important; }
        .btn-call-accept { background: #34c759 !important; }

        .incoming-slide-card {
            position: absolute; bottom: 30px; z-index: 30; width: 90%; max-width: 360px;
            background: var(--panel-dark); border: 1px solid var(--card-border);
            padding: 20px; border-radius: 24px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; display: flex; }
            .chat-main { display: none; width: 100%; }
            .mobile-chat-open .sidebar { display: none !important; }
            .mobile-chat-open .chat-main { display: flex !important; }
            #backBtn { display: inline-block !important; }
        }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="alien-logo-badge">Alien_0729👽</div>
        <div class="splash-title">Quantum Messenger Pro</div>
    </div>

    <div id="authOverlay">
        <div class="auth-card">
            <h2>Quantum Web</h2>
            <input type="text" id="inputName" placeholder="Username">
            <input type="password" id="inputCode" placeholder="Enter Passcode (Master: guddu05 / Dynamic)">
            <input type="text" id="inputAvatar" placeholder="Profile Avatar URL (Optional)">
            <button onclick="login()">Enter Chat</button>
        </div>
    </div>

    <div id="deleteModal">
        <div class="delete-card">
            <h4 style="margin-bottom:12px;">Message Options</h4>
            <button class="btn-reply-action" onclick="setReplyMessage()">↩ Reply</button>
            <button class="btn-del-me" onclick="execDeleteMe()">🗑 Delete for me</button>
            <button class="btn-del-everyone" id="btnDelEveryone" onclick="execDeleteEveryone()">🗑 Delete for everyone</button>
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
        </div>
    </div>

    <div id="callModal">
        <div class="call-top-bar">
            <h2 id="callTargetName" style="color:#fff; font-size:1.3rem;">User</h2>
            <div id="callStatusText" style="color:var(--accent-green); font-size:0.9rem; margin-top:4px;">Calling...</div>
        </div>

        <div class="video-full-container">
            <video id="mainVideo" autoplay playsinline></video>
            <video id="pipVideo" autoplay playsinline muted onclick="swapVideoViews()"></video>
        </div>

        <div class="incoming-slide-card" id="incomingSlideCard" style="display:none;">
            <h3 id="incomingCallerName" style="color:#fff;">Caller</h3>
            <p id="incomingCallType" style="color:var(--text-secondary); font-size:0.85rem; margin-top:4px;">Incoming Call</p>
            <div style="display:flex; justify-content:center; gap:20px; margin-top:18px;">
                <button class="call-btn-circle btn-call-accept" onclick="acceptCall()">📞</button>
                <button class="call-btn-circle btn-call-end" onclick="endCall()">✕</button>
            </div>
        </div>

        <div class="call-controls-bar" id="activeCallControls">
            <button class="call-btn-circle" onclick="switchCamera()" title="Switch Camera">🔄</button>
            <button class="call-btn-circle" onclick="toggleScreenShare()" title="Share Screen">🖥️</button>
            <button class="call-btn-circle" id="btnMuteMic" onclick="toggleMuteMic()" title="Mute Mic">🎙️</button>
            <button class="call-btn-circle btn-call-end" onclick="endCall()" title="End Call">📞</button>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile-badge">
                    <img id="myAvatarImg" src="" class="my-avatar" onclick="document.getElementById('avatarFileInput').click()">
                    <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="updateProfileLogo(this)">
                    <div>
                        <strong id="myUsernameText">User</strong>
                        <div id="myRoleBadge" style="font-size:0.75rem; color:var(--accent-green);">Online</div>
                    </div>
                </div>
            </div>

            <div class="admin-box" id="adminBox">
                <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                    <input type="text" id="customCodeInput" placeholder="New Dynamic Code" style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--card-border); background: #1f2c34; color: #fff; outline: none;">
                    <button onclick="setCustomCode()">Change</button>
                </div>
                <button onclick="generateCode()">🎲 Generate Random Code</button>
            </div>

            <div style="padding:10px 16px; font-size:0.8rem; color:var(--text-secondary); font-weight:bold;">CHATS</div>
            <div class="user-list" id="userListContainer"></div>
        </div>

        <div class="chat-main">
            <div class="chat-header">
                <div class="target-profile">
                    <button class="btn-icon" onclick="closeMobileChat()" style="display:none; font-size:1.3rem; margin-right:5px;" id="backBtn">←</button>
                    <img id="targetAvatarImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="target-avatar">
                    <div>
                        <strong id="targetNameText">Select User</strong>
                        <div id="targetStatusText" style="font-size:0.75rem; color:var(--text-secondary);">Offline</div>
                    </div>
                </div>
                
                <div class="header-actions">
                    <button class="btn-icon" style="color:var(--accent-green);" onclick="startCall(false)" title="Voice Call">📞</button>
                    <button class="btn-icon" style="color:var(--accent-green);" onclick="startCall(true)" title="Video Call">📹</button>
                </div>
            </div>

            <div class="chat-body" id="chatWin"></div>

            <div id="replyPreviewBar">
                <span id="replyPreviewText">Replying to message...</span>
                <button onclick="cancelReply()" style="background:none; border:none; color:#ff5252; cursor:pointer; font-weight:bold;">✕</button>
            </div>

            <div id="emojiBox">
                <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span>
                <span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('❤️')">❤️</span>
                <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🔥')">🔥</span>
                <span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('🙏')">🙏</span>
                <span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('😭')">😭</span>
            </div>

            <div class="chat-input" id="chatInputArea">
                <button class="btn-icon" onclick="toggleEmojiBox()">😊</button>
                <button class="btn-icon" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="sendMedia(this)">
                
                <input type="text" id="msgInput" class="input-box" placeholder="Type a message..." oninput="handleInputChange()" onkeydown="if(event.key==='Enter') sendText()">
                
                <button class="btn-icon" id="voiceBtn" onclick="toggleRecordAudio()" title="Record Voice Message">🎙</button>
                <button class="btn-icon" id="sendBtn" style="color:var(--accent-green); display:none;" onclick="sendText()" title="Send Message">➔</button>
            </div>
        </div>
    </div>

    <audio id="remoteAudio" autoplay style="display:none;"></audio>

    <script>
        const socket = io();
        let myName = '', selectedTargetUser = null, allHistory = [];
        let deletedForMeMsgIds = JSON.parse(localStorage.getItem('deletedForMe') || '[]');
        let unreadCounts = JSON.parse(localStorage.getItem('unreadCounts') || '{}');
        let selectedMsgForDelete = null;
        let activeReplyMsg = null;

        let mediaRecorder = null, audioChunks = [], isRecording = false;
        let typingTimeout = null;

        let peerConnection = null, localStream = null, remoteStream = null, incomingOffer = null, isVideoCall = false;
        let currentFacingMode = 'user';
        let isScreenSharing = false, isMicMuted = false, isMainVideoRemote = true;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        window.onload = () => {
            const savedName = localStorage.getItem('quantum_username');
            const savedCode = localStorage.getItem('quantum_passcode');
            const savedAvatar = localStorage.getItem('quantum_avatar');
            if(savedName && savedCode) {
                document.getElementById('inputName').value = savedName;
                document.getElementById('inputCode').value = savedCode;
                if(savedAvatar) document.getElementById('inputAvatar').value = savedAvatar;
                login(true);
            }
        };

        function login(isAuto = false) {
            myName = document.getElementById('inputName').value.trim();
            const code = document.getElementById('inputCode').value.trim();
            let avatar = document.getElementById('inputAvatar').value.trim();
            
            if(!myName || !code) return isAuto ? null : alert('Username & Passcode are required!');

            const savedAvatar = localStorage.getItem('quantum_avatar');
            if (!avatar && savedAvatar) {
                avatar = savedAvatar;
            }

            localStorage.setItem('quantum_username', myName);
            localStorage.setItem('quantum_passcode', code);
            if(avatar) localStorage.setItem('quantum_avatar', avatar);

            socket.emit('login-attempt', { username: myName, inputCode: code, avatarUrl: avatar });
        }

        socket.on('login-success', (data) => {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('myUsernameText').innerText = data.username;
            document.getElementById('myAvatarImg').src = data.avatarUrl;
            document.getElementById('myRoleBadge').innerText = data.isAdmin ? 'Master Admin 👑' : 'Pro User';
            
            localStorage.setItem('quantum_avatar', data.avatarUrl);
            if(data.isAdmin) document.getElementById('adminBox').style.display = 'block';
        });

        socket.on('login-failed', msg => {
            alert(msg);
        });

        function generateCode() { socket.emit('generate-new-code'); }
        function setCustomCode() {
            const newCode = document.getElementById('customCodeInput').value.trim();
            if(newCode) {
                socket.emit('set-custom-code', { newCode });
                document.getElementById('customCodeInput').value = '';
            }
        }

        socket.on('code-updated', (data) => alert(`Passcode Updated: ${data.newCode}`));

        function updateProfileLogo(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('myAvatarImg').src = e.target.result;
                    localStorage.setItem('quantum_avatar', e.target.result);
                    socket.emit('update-avatar', { username: myName, newAvatarUrl: e.target.result });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        socket.on('update-user-list', (users) => {
            const container = document.getElementById('userListContainer');
            container.innerHTML = '';
            const amIAdmin = document.getElementById('myRoleBadge').innerText.includes('Admin');

            users.forEach(u => {
                if(u.username !== myName) {
                    const div = document.createElement('div');
                    div.className = `user-item ${selectedTargetUser === u.username ? 'active' : ''}`;
                    const statusText = u.isOnline ? 'Online' : (u.lastSeen || 'Offline');
                    const unreadCount = unreadCounts[u.username] || 0;
                    
                    div.innerHTML = `
                        <img src="${u.avatarUrl}">
                        <div class="user-info">
                            <strong>${u.username} ${u.isAdmin ? '👑' : ''}</strong>
                            <span>${statusText}</span>
                        </div>
                        ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
                        ${u.isOnline ? '<div class="online-dot" style="margin-left:6px;"></div>' : ''}
                        ${amIAdmin && !u.isAdmin ? `<button class="kick-btn" style="margin-left:8px;" onclick="event.stopPropagation(); removeUser('${u.username}')">❌</button>` : ''}
                    `;
                    div.onclick = () => selectTargetUser(u);
                    container.appendChild(div);
                }
            });
        });

        function removeUser(targetUsername) {
            if(confirm(`Remove ${targetUsername}?`)) socket.emit('remove-user-by-admin', { targetUsername });
        }

        socket.on('kicked-by-admin', (msg) => {
            localStorage.clear();
            alert(msg);
            location.reload();
        });

        function selectTargetUser(userObj) {
            selectedTargetUser = userObj.username;
            unreadCounts[selectedTargetUser] = 0;
            localStorage.setItem('unreadCounts', JSON.stringify(unreadCounts));

            document.getElementById('targetNameText').innerText = userObj.username;
            document.getElementById('targetAvatarImg').src = userObj.avatarUrl;
            document.getElementById('targetStatusText').innerText = userObj.isOnline ? 'Online' : (userObj.lastSeen || 'Offline');
            document.body.classList.add('mobile-chat-open');
            renderFilteredHistory();
            socket.emit('update-user-list-trigger');
        }

        socket.on('load-chat-history', (history) => {
            allHistory = history;
            if(selectedTargetUser) renderFilteredHistory();
        });

        socket.on('receive-private-message', (msgObj) => {
            allHistory.push(msgObj);
            if(selectedTargetUser === msgObj.senderName || msgObj.senderName === myName) {
                renderFilteredHistory();
            } else if (msgObj.targetName === myName) {
                unreadCounts[msgObj.senderName] = (unreadCounts[msgObj.senderName] || 0) + 1;
                localStorage.setItem('unreadCounts', JSON.stringify(unreadCounts));
            }
        });

        socket.on('message-deleted-everyone', (data) => {
            allHistory = allHistory.filter(m => m.msgId !== data.msgId);
            renderFilteredHistory();
        });

        function openDeleteModal(msgObj) {
            selectedMsgForDelete = msgObj;
            document.getElementById('deleteModal').style.display = 'flex';
            document.getElementById('btnDelEveryone').style.display = msgObj.senderName === myName ? 'block' : 'none';
        }

        function closeDeleteModal() {
            selectedMsgForDelete = null;
            document.getElementById('deleteModal').style.display = 'none';
        }

        function setReplyMessage() {
            if(selectedMsgForDelete) {
                activeReplyMsg = selectedMsgForDelete;
                document.getElementById('replyPreviewBar').style.display = 'flex';
                document.getElementById('replyPreviewText').innerText = `Replying to: ${selectedMsgForDelete.message || selectedMsgForDelete.mediaType}`;
            }
            closeDeleteModal();
        }

        function cancelReply() {
            activeReplyMsg = null;
            document.getElementById('replyPreviewBar').style.display = 'none';
        }

        function execDeleteMe() {
            if(selectedMsgForDelete) {
                deletedForMeMsgIds.push(selectedMsgForDelete.msgId);
                localStorage.setItem('deletedForMe', JSON.stringify(deletedForMeMsgIds));
                renderFilteredHistory();
            }
            closeDeleteModal();
        }

        function execDeleteEveryone() {
            if(selectedMsgForDelete && selectedMsgForDelete.senderName === myName) {
                socket.emit('delete-message-everyone', { msgId: selectedMsgForDelete.msgId });
            }
            closeDeleteModal();
        }

        function renderFilteredHistory() {
            const win = document.getElementById('chatWin');
            win.innerHTML = '';
            
            const conversation = allHistory.filter(m => 
                ((m.senderName === myName && m.targetName === selectedTargetUser) ||
                (m.senderName === selectedTargetUser && m.targetName === myName)) &&
                !deletedForMeMsgIds.includes(m.msgId)
            );

            conversation.forEach(msg => {
                if(msg.mediaType === 'call_log') {
                    const div = document.createElement('div');
                    div.className = 'call-log-bubble';
                    div.innerHTML = `📞 ${msg.message} • ${msg.time}`;
                    div.onclick = () => openDeleteModal(msg);
                    win.appendChild(div);
                    return;
                }

                const isMe = msg.senderName === myName;
                const div = document.createElement('div');
                div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                div.onclick = () => openDeleteModal(msg);
                
                let html = `<strong>${isMe ? 'You' : msg.senderName}:</strong><br>`;
                
                if(msg.replyTo) {
                    html += `<div class="reply-quote">${msg.replyTo}</div>`;
                }

                if(msg.mediaType === 'text') html += msg.message;
                else if(msg.mediaType === 'image') html += `<img src="${msg.mediaUrl}">`;
                else if(msg.mediaType === 'video') html += `<video src="${msg.mediaUrl}" controls></video>`;
                else if(msg.mediaType === 'audio') html += `<audio src="${msg.mediaUrl}" controls></audio>`;
                
                html += `<div class="time-ticks"><span>${msg.time}</span> ${isMe ? '<span class="blue-ticks">✓✓</span>' : ''}</div>`;
                div.innerHTML = html;
                win.appendChild(div);
            });

            win.scrollTop = win.scrollHeight;
        }

        function handleInputChange() {
            const txt = document.getElementById('msgInput').value.trim();
            const sendBtn = document.getElementById('sendBtn');
            const voiceBtn = document.getElementById('voiceBtn');

            if (txt.length > 0) {
                sendBtn.style.display = 'flex';
                voiceBtn.style.display = 'none';
            } else {
                sendBtn.style.display = 'none';
                voiceBtn.style.display = 'flex';
            }

            if(selectedTargetUser) {
                socket.emit('typing', { targetName: selectedTargetUser, isTyping: true });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('typing', { targetName: selectedTargetUser, isTyping: false });
                }, 2000);
            }
        }

        function toggleEmojiBox() {
            const box = document.getElementById('emojiBox');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function addEmoji(emoji) {
            const input = document.getElementById('msgInput');
            input.value += emoji;
            handleInputChange();
            document.getElementById('emojiBox').style.display = 'none';
        }

        function sendText() {
            const txt = document.getElementById('msgInput').value.trim();
            if(!txt || !selectedTargetUser) return;
            
            socket.emit('send-private-message', {
                senderName: myName,
                targetName: selectedTargetUser,
                message: txt,
                mediaType: 'text',
                replyTo: activeReplyMsg ? `${activeReplyMsg.senderName}: ${activeReplyMsg.message || activeReplyMsg.mediaType}` : null
            });
            
            document.getElementById('msgInput').value = '';
            cancelReply();
            handleInputChange();
            socket.emit('typing', { targetName: selectedTargetUser, isTyping: false });
        }

        function sendMedia(input) {
            if(input.files && input.files[0] && selectedTargetUser) {
                const file = input.files[0];
                const isVideo = file.type.startsWith('video/');
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('send-private-message', {
                        senderName: myName,
                        targetName: selectedTargetUser,
                        mediaType: isVideo ? 'video' : 'image',
                        mediaUrl: e.target.result
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        async function toggleRecordAudio() {
            if(!selectedTargetUser) return alert('Select user first!');
            const btn = document.getElementById('voiceBtn');
            
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('send-private-message', {
                                senderName: myName,
                                targetName: selectedTargetUser,
                                mediaType: 'audio',
                                mediaUrl: e.target.result
                            });
                        };
                        reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.color = 'red';
                } catch(err) {
                    alert('Microphone Access Denied!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.color = 'var(--text-secondary)';
            }
        }

        socket.on('user-typing-status', (data) => {
            if(selectedTargetUser === data.fromUser) {
                document.getElementById('targetStatusText').innerText = data.isTyping ? 'typing...' : 'Online';
                document.getElementById('targetStatusText').style.color = data.isTyping ? 'var(--accent-green)' : 'var(--text-secondary)';
            }
        });

        function closeMobileChat() { document.body.classList.remove('mobile-chat-open'); }

        async function getHDMediaStream(video, facing) {
            const constraints = {
                audio: { echoCancellation: true, noiseSuppression: true },
                video: video ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facing } : false
            };
            return await navigator.mediaDevices.getUserMedia(constraints);
        }

        async function startCall(videoMode) {
            if(!selectedTargetUser) return alert('Select user to call!');
            isVideoCall = videoMode;

            socket.emit('send-private-message', {
                senderName: myName,
                targetName: selectedTargetUser,
                message: isVideoCall ? 'Outgoing Video Call' : 'Outgoing Voice Call',
                mediaType: 'call_log'
            });

            document.getElementById('callModal').style.display = 'flex';
            document.getElementById('callTargetName').innerText = selectedTargetUser;
            document.getElementById('callStatusText').innerText = 'Calling...';
            document.getElementById('incomingSlideCard').style.display = 'none';
            document.getElementById('activeCallControls').style.display = 'flex';

            localStream = await getHDMediaStream(isVideoCall, currentFacingMode);
            assignStreamViews();

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = e => {
                remoteStream = e.streams[0];
                assignStreamViews();
            };

            peerConnection.onicecandidate = e => {
                if(e.candidate) socket.emit('ice-candidate', { targetName: selectedTargetUser, candidate: e.candidate });
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.emit('call-user', { targetName: selectedTargetUser, offer, isVideo: isVideoCall });
        }

        socket.on('incoming-call', async (data) => {
            incomingOffer = data.offer;
            isVideoCall = data.isVideo;
            selectedTargetUser = data.fromUser;
            
            document.getElementById('callModal').style.display = 'flex';
            document.getElementById('callTargetName').innerText = data.fromUser;
            document.getElementById('callStatusText').innerText = isVideoCall ? 'Incoming Video Call...' : 'Incoming Voice Call...';
            
            document.getElementById('incomingCallerName').innerText = data.fromUser;
            document.getElementById('incomingCallType').innerText = isVideoCall ? 'Incoming Video Call' : 'Incoming Voice Call';
            document.getElementById('incomingSlideCard').style.display = 'block';
            document.getElementById('activeCallControls').style.display = 'none';
        });

        async function acceptCall() {
            document.getElementById('incomingSlideCard').style.display = 'none';
            document.getElementById('activeCallControls').style.display = 'flex';
            document.getElementById('callStatusText').innerText = 'Connected';

            localStream = await getHDMediaStream(isVideoCall, currentFacingMode);
            assignStreamViews();

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = e => {
                remoteStream = e.streams[0];
                assignStreamViews();
            };

            peerConnection.onicecandidate = e => {
                if(e.candidate) socket.emit('ice-candidate', { targetName: selectedTargetUser, candidate: e.candidate });
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.emit('answer-call', { targetName: selectedTargetUser, answer });
        }

        socket.on('call-accepted', async (data) => {
            document.getElementById('callStatusText').innerText = 'Connected';
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', async (data) => {
            if(peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        });

        socket.on('call-ended', () => endCallUI());

        function assignStreamViews() {
            const mainVid = document.getElementById('mainVideo');
            const pipVid = document.getElementById('pipVideo');

            if (isMainVideoRemote) {
                if (remoteStream) mainVid.srcObject = remoteStream;
                if (localStream) pipVid.srcObject = localStream;
            } else {
                if (localStream) mainVid.srcObject = localStream;
                if (remoteStream) pipVid.srcObject = remoteStream;
            }
        }

        function swapVideoViews() {
            isMainVideoRemote = !isMainVideoRemote;
            assignStreamViews();
        }

        async function switchCamera() {
            if (!isVideoCall || !localStream) return;
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            
            localStream.getTracks().forEach(track => track.stop());
            localStream = await getHDMediaStream(true, currentFacingMode);
            
            const videoTrack = localStream.getVideoTracks()[0];
            const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
            if (sender) sender.replaceTrack(videoTrack);
            
            assignStreamViews();
        }

        async function toggleScreenShare() {
            if (!peerConnection) return;
            
            if (!isScreenSharing) {
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = screenStream.getVideoTracks()[0];
                    const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(screenTrack);
                    
                    document.getElementById('mainVideo').srcObject = screenStream;
                    isScreenSharing = true;

                    screenTrack.onended = () => toggleScreenShare();
                } catch(err) {
                    console.log('Screen sharing cancelled');
                }
            } else {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(videoTrack);
                assignStreamViews();
                isScreenSharing = false;
            }
        }

        function toggleMuteMic() {
            if (localStream) {
                isMicMuted = !isMicMuted;
                localStream.getAudioTracks()[0].enabled = !isMicMuted;
                document.getElementById('btnMuteMic').innerText = isMicMuted ? '🔇' : '🎙️';
            }
        }

        function endCall() {
            if(selectedTargetUser) socket.emit('end-call', { targetName: selectedTargetUser });
            endCallUI();
        }

        function endCallUI() {
            if(peerConnection) peerConnection.close();
            if(localStream) localStream.getTracks().forEach(track => track.stop());
            peerConnection = null;
            localStream = null;
            remoteStream = null;
            document.getElementById('callModal').style.display = 'none';
        }
    </script>
</body>
</html>
