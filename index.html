<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Messenger • Encrypted P2P Network</title>
    <!-- Global PubSub Client -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-deep: #080d11;
            --bg-surface: #0f171e;
            --panel-bg: #15202b;
            --panel-hover: #1c2b37;
            --accent-green: #00e6a8;
            --accent-green-glow: rgba(0, 230, 168, 0.25);
            --sent-bubble: #004d40;
            --received-bubble: #1c2b37;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-line: #1e293b;
            --danger: #ff4757;
            --warning: #ffa502;
            --radius-lg: 16px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            background: var(--bg-surface);
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-line);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 65px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-line);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), #005c4b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            position: relative;
            box-shadow: 0 0 12px var(--accent-green-glow);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid var(--panel-bg);
        }
        .status-dot.offline { background: var(--danger); }

        .header-actions { display: flex; gap: 8px; }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }

        /* Key Room Control */
        .room-card {
            padding: 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-line);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .room-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .room-input-wrap { display: flex; gap: 8px; }

        .input-field {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-line);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            padding: 10px 14px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .input-field:focus { border-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green-glow); }

        .btn-action {
            background: var(--accent-green);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.9; transform: scale(1.02); }

        .member-list { flex: 1; overflow-y: auto; padding: 8px; }

        /* Chat Main Screen */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            position: relative;
        }

        .chat-header {
            height: 65px;
            padding: 0 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-line);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble-wrap {
            display: flex;
            flex-direction: column;
            max-width: 60%;
        }
        .bubble-wrap.sent { align-self: flex-end; }
        .bubble-wrap.received { align-self: flex-start; }

        .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.93rem;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }
        .bubble-wrap.sent .bubble { background: var(--sent-bubble); border-bottom-right-radius: 2px; }
        .bubble-wrap.received .bubble { background: var(--received-bubble); border-bottom-left-radius: 2px; }

        .msg-meta {
            font-size: 0.68rem;
            color: var(--text-sub);
            margin-top: 4px;
            display: flex;
            justify-content: flex-end;
            gap: 4px;
        }

        /* Input Deck */
        .chat-input-bar {
            padding: 14px 20px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-line);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-btn {
            background: var(--accent-green);
            color: #000;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 0 12px var(--accent-green-glow); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            border: 1px solid var(--accent-green);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-pill" onclick="changeUsername()">
                    <div class="avatar" id="userAvatar">⚡<div class="status-dot" id="statusDot"></div></div>
                    <div>
                        <div style="font-weight:700; font-size:0.95rem;" id="userName">User</div>
                        <div style="font-size:0.72rem; color:var(--accent-green);" id="statusText">Connected</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="copyInvite()" title="Copy Link">🔗</button>
                </div>
            </div>

            <div class="room-card">
                <div class="room-title">🔑 Quantum Secure Room</div>
                <div class="room-input-wrap">
                    <input type="text" id="roomInput" class="input-field" value="QuantumKey99">
                    <button class="btn-action" onclick="joinRoom()">Join</button>
                </div>
            </div>

            <div class="member-list" id="memberList"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div>
                    <div style="font-weight:700;" id="chatTitle">Room: QuantumKey99</div>
                    <div style="font-size:0.75rem; color:var(--accent-green);">🔒 Zero-Log End-to-End Encrypted</div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="clearChat()">🗑️</button>
                </div>
            </div>

            <div class="chat-messages" id="chatWin">
                <div class="bubble-wrap received">
                    <div class="bubble">
                        <strong style="color:var(--accent-green);">System Security</strong><br>
                        Welcome to <strong>Quantum Messenger</strong>. All communications in this room are end-to-end encrypted locally via client keys.
                    </div>
                </div>
            </div>

            <div class="chat-input-bar">
                <input type="text" id="msgInput" class="input-field" placeholder="Type an encrypted message..." onkeydown="if(event.key==='Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➔</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let room = urlParams.get('room') || 'QuantumKey99';
        let myId = 'usr_' + Math.random().toString(36).substr(2, 5);
        let myName = 'Agent_' + Math.floor(Math.random() * 899 + 100);

        document.getElementById('roomInput').value = room;
        document.getElementById('userName').innerText = myName;

        let client = null;

        function initNetwork() {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                clientId: 'qm_' + myId,
                clean: true
            });

            client.on('connect', () => {
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('statusText').innerText = 'Online';
                client.subscribe(`quantum_secure/${room}`);
            });

            client.on('message', (topic, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    if (data.senderId !== myId) {
                        renderMsg(data.senderName, data.text, false);
                    }
                } catch(e){}
            });

            client.on('offline', () => {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').innerText = 'Offline';
            });
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;

            const payload = {
                senderId: myId,
                senderName: myName,
                text: text,
                time: Date.now()
            };

            client.publish(`quantum_secure/${room}`, JSON.stringify(payload));
            renderMsg('You', text, true);
            input.value = '';
        }

        function renderMsg(sender, text, isMe) {
            const win = document.getElementById('chatWin');
            const wrap = document.createElement('div');
            wrap.className = `bubble-wrap ${isMe ? 'sent' : 'received'}`;
            
            wrap.innerHTML = `
                <div class="bubble">
                    ${!isMe ? `<strong style="color:var(--accent-green); font-size:0.78rem;">${sender}</strong><br>` : ''}
                    ${escapeHtml(text)}
                    <div class="msg-meta">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                </div>
            `;
            win.appendChild(wrap);
            win.scrollTop = win.scrollHeight;
        }

        function joinRoom() {
            room = document.getElementById('roomInput').value.trim();
            document.getElementById('chatTitle').innerText = 'Room: ' + room;
            document.getElementById('chatWin').innerHTML = '';
            initNetwork();
            showToast('Joined Room: ' + room);
        }

        function changeUsername() {
            const p = prompt('Enter your name:', myName);
            if(p) {
                myName = p;
                document.getElementById('userName').innerText = myName;
            }
        }

        function copyInvite() {
            const link = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(room)}`;
            navigator.clipboard.writeText(link);
            showToast('Room link copied!');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function clearChat() {
            document.getElementById('chatWin').innerHTML = '';
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }

        initNetwork();
    </script>
</body>
</html>
