<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Messenger Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-messaging-compat.js"></script>
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-dark: #111b21;
            --header-dark: #202c33;
            --accent-green: #00a884;
            --bubble-sent: #005c4b;
            --bubble-recv: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --card-border: #222d34;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; background: var(--bg-dark); color: var(--text-primary); overflow: hidden; }

        #splashScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #0b141a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            animation: fadeOut 0.8s ease 1.5s forwards;
        }

        .alien-logo-badge {
            width: 150px; height: 150px; border-radius: 50%;
            background: linear-gradient(135deg, #1f2c34, #0b141a);
            border: 3px solid var(--accent-green); color: var(--accent-green);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.15rem; font-weight: bold; letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(0, 168, 132, 0.6);
            animation: pulseZoom 1.2s infinite alternate ease-in-out;
            text-shadow: 0 0 10px rgba(0, 255, 180, 0.7); user-select: none;
        }

        .splash-title { color: var(--accent-green); margin-top: 20px; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; }

        @keyframes pulseZoom {
            from { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 168, 132, 0.4); }
            to { transform: scale(1.08); box-shadow: 0 0 35px rgba(0, 168, 132, 0.8); }
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: var(--panel-dark); padding: 25px; border-radius: 16px; width: 90%; max-width: 350px; text-align: center; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-card h2 { color: var(--accent-green); margin-bottom: 18px; }
        .auth-card input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: #1f2c34; color: #fff; margin-bottom: 12px; outline: none; font-size: 0.95rem; }
        .auth-card button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-green); color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem; }

        .app-container { width: 100vw; height: 100dvh; display: none; flex-direction: row; overflow: hidden; }

        .sidebar { width: 360px; background: var(--panel-dark); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { height: 65px; background: var(--header-dark); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); }
        .user-profile-badge { display: flex; align-items: center; gap: 12px; }
        .my-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-green); cursor: pointer; }

        .admin-box { padding: 12px; background: #182229; border-bottom: 1px solid var(--card-border); display: none; }
        .admin-box button { width: 100%; padding: 8px; background: var(--accent-green); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; display: flex; align-items: center; gap: 12px; position: relative; transition: background 0.2s; }
        .user-item:hover, .user-item.active { background: #202c33; }
        .user-item img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; cursor: pointer; }
        .user-info { flex: 1; min-width: 0; }
        .user-info strong { display: block; font-size: 0.95rem; color: var(--text-primary); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-info span { font-size: 0.8rem; color: var(--text-secondary); }
        .online-dot { width: 10px; height: 10px; background: var(--accent-green); border-radius: 50%; }
        
        .unread-badge { background: var(--accent-green); color: #000; font-size: 0.75rem; font-weight: bold; padding: 2px 7px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .kick-btn { background: #ff5252; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); height: 100dvh; min-width: 0; position: relative; }
        .chat-header { height: 65px; background: var(--header-dark); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); flex-shrink: 0; }
        .target-profile { display: flex; align-items: center; gap: 12px; }
        .target-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; cursor: pointer; }
        .header-actions { display: flex; gap: 12px; align-items: center; position: relative; }

        .dropdown-menu {
            display: none; position: absolute; right: 0; top: 45px; background: var(--panel-dark);
            border: 1px solid var(--card-border); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 600; width: 160px; overflow: hidden;
        }
        .dropdown-item { padding: 10px 14px; font-size: 0.9rem; cursor: pointer; color: var(--text-primary); }
        .dropdown-item:hover { background: #202c33; }

        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#182229 1px, transparent 1px); background-size: 20px 20px; }

        #replyPreviewBar { display: none; background: #1f2c34; border-left: 4px solid var(--accent-green); padding: 8px 12px; margin: 0 12px; border-radius: 6px; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-secondary); }

        .chat-input { min-height: 65px; background: var(--header-dark); padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; border-top: 1px solid var(--card-border); position: relative; }
        .input-box { flex: 1; padding: 10px 16px; border-radius: 20px; border: none; background: #2a3942; color: #fff; outline: none; font-size: 0.95rem; resize: none; max-height: 120px; }
        .btn-icon { background: none; border: none; color: var(--text-secondary); font-size: 1.35rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; flex-shrink: 0; }
        .btn-icon:hover { color: var(--accent-green); }

        #emojiBox { 
            display: none; position: absolute; bottom: 72px; left: 10px; 
            background: var(--panel-dark); border: 1px solid var(--card-border); 
            padding: 12px; border-radius: 12px; width: 320px; max-height: 250px; 
            overflow-y: auto; flex-wrap: wrap; gap: 10px; z-index: 500; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.7); 
        }
        #emojiBox span { font-size: 1.4rem; cursor: pointer; user-select: none; transition: transform 0.1s; }
        #emojiBox span:hover { transform: scale(1.3); }

        #mediaModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px;
        }
        .media-modal-header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .media-modal-content { max-width: 90%; max-height: 70vh; object-fit: contain; border-radius: 8px; }
        .media-modal-footer { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; }

        #mediaPreviewModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(11,20,26,0.96); z-index: 9500; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px;
        }

        #dpViewerModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px;
        }
        #dpViewerImg { max-width: 90%; max-height: 80vh; border-radius: 12px; object-fit: contain; box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 0.92rem; word-break: break-word; position: relative; cursor: pointer; }
        .msg.sent { align-self: flex-end; background: var(--bubble-sent); }
        .msg.recv { align-self: flex-start; background: var(--bubble-recv); }
        .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 5px; max-height: 250px; cursor: pointer; }
        .msg audio { max-width: 100%; margin-top: 5px; }
        
        /* AESTHETIC GLOWING VIEW ONCE BADGE */
        .view-once-badge {
            display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, rgba(0, 168, 132, 0.25), rgba(11, 20, 26, 0.8));
            color: #00ffcc; border: 1.5px solid var(--accent-green); padding: 8px 16px;
            border-radius: 25px; font-size: 0.88rem; font-weight: bold; margin-top: 6px; cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 168, 132, 0.4); transition: all 0.2s ease;
        }
        .view-once-badge:hover { transform: scale(1.04); box-shadow: 0 0 18px rgba(0, 255, 204, 0.7); }
        .view-once-badge.opened {
            background: rgba(255,255,255,0.05); color: var(--text-secondary); border-color: var(--card-border);
            box-shadow: none; opacity: 0.65; cursor: default;
        }

        .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent-green); padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; font-size: 0.8rem; color: #b0bec5; }
        .time-ticks { font-size: 0.68rem; color: var(--text-secondary); text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
        .blue-ticks { color: #53bdeb; font-weight: bold; font-size: 0.85rem; letter-spacing: -1.5px; }
        .grey-ticks { color: var(--text-secondary); font-weight: bold; font-size: 0.85rem; letter-spacing: -1.5px; }
        .call-log-bubble { align-self: center; background: #1f2c34; border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 12px; font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; margin: 4px 0; }

        #cameraModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000; z-index: 8500; flex-direction: column; justify-content: space-between; align-items: center;
        }
        #camPreview { width: 100%; height: 80%; object-fit: cover; transform: scaleX(-1); }
        .cam-controls { width: 100%; padding: 20px; display: flex; justify-content: space-around; align-items: center; background: #111b21; }
        .cam-shutter-btn { width: 65px; height: 65px; border-radius: 50%; border: 4px solid #fff; background: var(--accent-green); cursor: pointer; }

        #inAppNotificationToast {
            display: none; position: fixed; top: 20px; right: 20px; background: var(--panel-dark);
            color: #fff; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--card-border);
            z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #deleteModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; justify-content: center; align-items: center; }
        .delete-card { background: var(--panel-dark); padding: 20px; border-radius: 16px; border: 1px solid var(--card-border); width: 290px; text-align: center; }
        .delete-card button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-reply-action { background: var(--accent-green); color: #fff; }
        .btn-del-everyone { background: #ff5252; color: #fff; }
        .btn-del-me { background: #2a3942; color: #fff; }
        .btn-cancel { background: transparent; color: var(--text-secondary); }

        #screenShareConfirmModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;
        }
        .confirm-card { background: var(--panel-dark); padding: 25px; border-radius: 16px; border: 1px solid var(--card-border); width: 90%; max-width: 320px; text-align: center; }
        .confirm-card h3 { color: var(--accent-green); margin-bottom: 12px; }
        .confirm-card p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; }
        .confirm-actions { display: flex; gap: 12px; }
        .confirm-actions button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-confirm-yes { background: var(--accent-green); color: #fff; }
        .btn-confirm-no { background: #2a3942; color: #fff; }

        /* AESTHETIC WHITEBOARD TOOLBAR */
        #whiteboardModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(11, 20, 26, 0.98); z-index: 8000; flex-direction: column;
        }
        .wb-header {
            min-height: 65px; background: var(--header-dark); padding: 10px 20px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
            border-bottom: 1px solid var(--card-border); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .wb-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #182229; padding: 6px 14px; border-radius: 30px; border: 1px solid var(--card-border); }
        .wb-tool-btn {
            background: #2a3942; border: 1px solid var(--card-border); color: #fff;
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
            transition: all 0.2s ease-in-out; display: flex; align-items: center; gap: 6px;
        }
        .wb-tool-btn:hover { background: #32434d; }
        .wb-tool-btn.active { background: var(--accent-green); border-color: var(--accent-green); color: #000; box-shadow: 0 0 10px rgba(0, 168, 132, 0.6); }
        .wb-canvas-container { flex: 1; position: relative; width: 100%; height: calc(100dvh - 65px); cursor: crosshair; overflow: hidden; }
        #liveWhiteboard { display: block; width: 100%; height: 100%; background: #0b141a; touch-action: none; }

        #callModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000; z-index: 9000; flex-direction: column; justify-content: space-between; align-items: center;
        }
        .video-full-container { position: absolute; top:0; left:0; width:100%; height:100%; overflow:hidden; z-index:1; touch-action: none; }
        #mainVideo { width: 100%; height: 100%; object-fit: cover; background: #111; transition: transform 0.1s ease-out; transform-origin: center center; }
        #pipVideo {
            position: absolute; top: 80px; right: 20px; width: 130px; height: 180px;
            object-fit: cover; border-radius: 12px; border: 2px solid var(--accent-green);
            z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.8); cursor: grab; touch-action: none; background: #222;
            transition: transform 0.1s ease-out; transform-origin: center center;
        }
        .mirror-self { transform: scaleX(-1); }
        .no-mirror { transform: scaleX(1); }

        .call-top-bar {
            position: relative; z-index: 10; width: 100%; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); pointer-events: none;
        }
        .call-controls-bar {
            position: relative; z-index: 10; width: 100%; padding: 25px 20px;
            display: flex; justify-content: center; gap: 20px; align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        .call-btn-circle {
            width: 55px; height: 55px; border-radius: 50%; border: none;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.3rem; cursor: pointer; color: #fff; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px); transition: background 0.2s;
        }
        .btn-call-end { background: #ff3b30 !important; }
        .btn-call-accept { background: #34c759 !important; }
        .incoming-slide-card {
            position: absolute; bottom: 30px; z-index: 30; width: 90%; max-width: 360px;
            background: var(--panel-dark); border: 1px solid var(--card-border);
            padding: 20px; border-radius: 24px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; display: flex; }
            .chat-main { display: none; width: 100%; }
            .mobile-chat-open .sidebar { display: none !important; }
            .mobile-chat-open .chat-main { display: flex !important; }
            #backBtn { display: inline-block !important; }
        }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="alien-logo-badge">Alien_0729👽</div>
        <div class="splash-title">Quantum Messenger Pro</div>
    </div>

    <div id="authOverlay">
        <div class="auth-card">
            <h2>Quantum Web</h2>
            <input type="text" id="inputName" placeholder="Username">
            <input type="password" id="inputCode" placeholder="Enter Passcode (Master: guddu05 / Dynamic)">
            <input type="text" id="inputAvatar" placeholder="Profile Avatar URL (Optional)">
            <button onclick="login()">Enter Chat</button>
        </div>
    </div>

    <div id="screenShareConfirmModal">
        <div class="confirm-card">
            <h3>Share Screen</h3>
            <p>Do you want to share your screen with the participant?</p>
            <div class="confirm-actions">
                <button class="btn-confirm-no" onclick="closeScreenShareConfirm(false)">Cancel</button>
                <button class="btn-confirm-yes" onclick="closeScreenShareConfirm(true)">Share</button>
            </div>
        </div>
    </div>

    <div id="dpViewerModal">
        <div class="media-modal-header">
            <button class="btn-icon" style="color:#fff; font-size:1.5rem;" onclick="closeDpViewer()">← Back</button>
            <span id="dpUsernameTitle" style="font-weight:bold; color:var(--text-primary);">Profile Photo</span>
            <span></span>
        </div>
        <div style="display:flex; justify-content:center; align-items:center; flex:1; width:100%;">
            <img id="dpViewerImg" src="">
        </div>
    </div>

    <div id="mediaModal">
        <div class="media-modal-header">
            <button class="btn-icon" style="color:#fff; font-size:1.5rem;" onclick="closeMediaModal()">← Back</button>
            <a id="downloadMediaBtn" href="#" download="quantum_media.jpg" class="btn-icon" style="color:#fff; font-size:1.3rem;" title="Save to Gallery">📥</a>
        </div>
        <div style="display:flex; justify-content:center; align-items:center; flex:1; width:100%;">
            <img id="modalImg" class="media-modal-content" style="display:none;">
            <video id="modalVid" class="media-modal-content" controls style="display:none;"></video>
        </div>
        <div class="media-modal-footer"></div>
    </div>

    <div id="mediaPreviewModal">
        <div class="media-modal-header">
            <button class="btn-icon" style="color:#fff; font-size:1.5rem;" onclick="closeMediaPreview()">✕</button>
            <span style="font-weight:bold; color:var(--text-primary);" id="mediaCountText">Send Media</span>
            <span></span>
        </div>
        <div style="display:flex; justify-content:center; align-items:center; flex:1; width:100%;">
            <img id="previewImg" class="media-modal-content" style="display:none;">
            <video id="previewVid" class="media-modal-content" controls style="display:none;"></video>
        </div>
        <div class="media-modal-footer" style="padding-bottom: 20px;">
            <div style="display:flex; align-items:center; gap:10px; background:#1f2c34; padding:8px 16px; border-radius:20px; border:1px solid var(--card-border);">
                <input type="checkbox" id="viewOnceCheckbox" style="width:18px; height:18px; accent-color:var(--accent-green); cursor:pointer;">
                <label for="viewOnceCheckbox" style="font-size:0.9rem; cursor:pointer; color:var(--text-primary);">View Once (1️⃣)</label>
            </div>
            <button onclick="confirmSendMediaAll()" style="background:var(--accent-green); color:#fff; border:none; padding:12px 30px; border-radius:24px; font-weight:bold; font-size:1rem; cursor:pointer; box-shadow:0 4px 15px rgba(0,168,132,0.4);">Send All ➔</button>
        </div>
    </div>

    <div id="deleteModal">
        <div class="delete-card">
            <h4 style="margin-bottom:12px;">Message Options</h4>
            <button class="btn-reply-action" onclick="setReplyMessage()">↩ Reply</button>
            <button class="btn-del-me" onclick="execDeleteMe()">🗑 Delete for me</button>
            <button class="btn-del-everyone" id="btnDelEveryone" onclick="execDeleteEveryone()">🗑 Delete for everyone</button>
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
        </div>
    </div>

    <div id="cameraModal">
        <video id="camPreview" autoplay playsinline></video>
        <div class="cam-controls">
            <button class="btn-icon" style="color:#fff; font-size:1.8rem;" onclick="closeCamera()">✕</button>
            <div class="cam-shutter-btn" onclick="captureDirectPhoto()"></div>
            <button class="btn-icon" style="color:#fff; font-size:1.8rem;" onclick="switchDirectCamera()">🔄</button>
        </div>
    </div>

    <div id="inAppNotificationToast">
        <div style="font-weight:bold; font-size:0.9rem;" id="toastSender">New Message</div>
        <div style="font-size:0.8rem; color:var(--text-secondary);" id="toastMessage"></div>
    </div>

    <div id="whiteboardModal">
        <div class="wb-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="wb-tool-btn" style="background:var(--accent-green); color:#000;" onclick="closeWhiteboardModal()">← Back</button>
                <span style="font-size:1.4rem; color:var(--accent-green); font-weight:bold;" title="Infinity Whiteboard">∞</span>
                <span id="wbPartnerBadge" style="font-size:0.85rem; color:var(--text-secondary); font-weight: 600;"></span>
            </div>
            <div class="wb-tools">

        function login(isAuto = false) {
            myName = document.getElementById('inputName').value.trim();

            if(!myName) return alert('Username is required!');

            const savedAvatar = localStorage.getItem('quantum_avatar');
            if (!avatar && savedAvatar) avatar = savedAvatar;

            localStorage.setItem('quantum_username', myName);
            if(code) localStorage.setItem('quantum_passcode', code);

            requestNotificationPermission();

            const clientTimeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

            allHistory.push(msgObj);

                if(selectedTargetUser === msgObj.senderName) {
                    socket.emit('mark-messages-read', { senderName: selectedTargetUser, readerName: myName });
                }
                renderFilteredHistory();

            const menu = document.getElementById('headerDropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';

        function clearCurrentChat() {
            if(!selectedTargetUser) return;
            if(confirm('Clear chat history on your screen?')) {
                allHistory.forEach(m => {
                    if((m.senderName === myName && m.targetName === selectedTargetUser) ||
                       (m.senderName === selectedTargetUser && m.targetName === myName)) {
                        if(!deletedForMeMsgIds.includes(m.msgId)) deletedForMeMsgIds.push(m.msgId);
                    }
                });
                localStorage.setItem('deletedForMe', JSON.stringify(deletedForMeMsgIds));
                renderFilteredHistory();
            }
            document.getElementById('headerDropdownMenu').style.display = 'none';
        }

        function renderFilteredHistory() {
            const win = document.getElementById('chatWin');
            win.innerHTML = '';
            
            const conversation = allHistory.filter(m => 
                ((m.senderName === myName && m.targetName === selectedTargetUser) ||
                (m.senderName === selectedTargetUser && m.targetName === myName)) &&
                !deletedForMeMsgIds.includes(m.msgId)
            );

            conversation.forEach(msg => {
                if(msg.mediaType === 'call_log') {
                    const div = document.createElement('div');
                    div.className = 'call-log-bubble';
                    div.innerHTML = `📞 ${msg.message} • ${msg.time}`;
                    div.onclick = () => openDeleteModal(msg);
                    win.appendChild(div);
                    return;
                }

                const isMe = msg.senderName === myName;
                const div = document.createElement('div');
                div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                div.onclick = () => openDeleteModal(msg);
                
                let html = `<strong>${isMe ? 'You' : msg.senderName}:</strong><br>`;
                if(msg.replyTo) html += `<div class="reply-quote">${msg.replyTo}</div>`;

                // VIEW ONCE LOGIC & AESTHETIC BADGE
                if(msg.isViewOnce) {
                    if (msg.isOpened) {
                        html += `<div class="view-once-badge opened">👁‍🗨️ View Once (Opened)</div>`;
                    } else {
                        if (isMe) {
                            html += `<div class="view-once-badge opened">1️⃣ View Once Photo (Sent)</div>`;
                        } else {
                            html += `<div class="view-once-badge" onclick="event.stopPropagation(); openViewOnceMsg('${msg.msgId}', '${msg.mediaUrl}', '${msg.mediaType}')">1️⃣ View Once Photo</div>`;
                        }
                    }
                } else {
                    if(msg.mediaType === 'text') html += msg.message;
                    else if(msg.mediaType === 'image') html += `<img src="${msg.mediaUrl}" onclick="event.stopPropagation(); openMediaModal('${msg.mediaUrl}', 'image', false)">`;
                    else if(msg.mediaType === 'video') html += `<video src="${msg.mediaUrl}" controls onclick="event.stopPropagation(); openMediaModal('${msg.mediaUrl}', 'video', false)"></video>`;
                    else if(msg.mediaType === 'audio') html += `<audio src="${msg.mediaUrl}" controls></audio>`;
                }

                // WHATSAPP STYLE TICK SYSTEM
                let ticksHtml = '';
                if (isMe) {
                    if (msg.isRead) {
                        ticksHtml = '<span class="blue-ticks">✓✓</span>';
                    } else if (msg.isDelivered) {
                        ticksHtml = '<span class="grey-ticks">✓✓</span>';
                    } else {
                        ticksHtml = '<span class="grey-ticks">✓</span>';
                    }
                }
                
                html += `<div class="time-ticks"><span>${msg.time}</span> ${ticksHtml}</div>`;
                div.innerHTML = html;
                win.appendChild(div);
            });

            win.scrollTop = win.scrollHeight;
        }

            const modal = document.getElementById('mediaModal');
            const img = document.getElementById('modalImg');
            const vid = document.getElementById('modalVid');
            const dlBtn = document.getElementById('downloadMediaBtn');

            modal.style.display = 'flex';
            
            if (isViewOnce) {
                dlBtn.style.display = 'none';
            } else {
                dlBtn.style.display = 'flex';
                dlBtn.href = url;
            }

            if(type === 'image') {
                img.src = url;
                img.style.display = 'block';
                vid.style.display = 'none';
            } else {
                vid.src = url;
                vid.style.display = 'block';
                img.style.display = 'none';
            }
        }

        function closeMediaModal() {
            document.getElementById('mediaModal').style.display = 'none';
            document.getElementById('modalVid').pause();
        }

        function openViewOnceMsg(msgId, url, type) {
            const msgObj = allHistory.find(m => m.msgId === msgId);
            if(msgObj && msgObj.senderName === myName) return; // Prevent sender consumption
            
            openMediaModal(url, type, true);
            socket.emit('mark-viewonce-opened', { msgId });
            if(msgObj) msgObj.isOpened = true;
            renderFilteredHistory();
        }

        socket.on('viewonce-opened-update', (data) => {
            const msgObj = allHistory.find(m => m.msgId === data.msgId);
            if(msgObj) msgObj.isOpened = true;
            renderFilteredHistory();
        });

        function handleFileSelect(input) {
            if(input.files && input.files.length > 0 && selectedTargetUser) {
                pendingMediaFiles = Array.from(input.files);
                document.getElementById('viewOnceCheckbox').checked = false;
                showMediaBatchPreview();
                input.value = '';
            }
        }

        function showMediaBatchPreview() {
            if(pendingMediaFiles.length > 0) {
                const firstFile = pendingMediaFiles[0];
                const isVideo = firstFile.type.startsWith('video/');
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('previewImg');
                    const vid = document.getElementById('previewVid');
                    document.getElementById('mediaPreviewModal').style.display = 'flex';
                    document.getElementById('mediaCountText').innerText = `Send ${pendingMediaFiles.length} Media File(s)`;

                    if(isVideo) {
                        vid.src = e.target.result;
                        vid.style.display = 'block';
                        img.style.display = 'none';
                    } else {
                        img.src = e.target.result;
                        img.style.display = 'block';
                        vid.style.display = 'none';
                    }
                };
                reader.readAsDataURL(firstFile);
            }
        }

        function closeMediaPreview() {
            document.getElementById('mediaPreviewModal').style.display = 'none';
            document.getElementById('previewVid').pause();
            pendingMediaFiles = [];
        }

        function confirmSendMediaAll() {
            if(!selectedTargetUser || pendingMediaFiles.length === 0) return;
            const isViewOnce = document.getElementById('viewOnceCheckbox').checked;
            const clientTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

            const filesToSend = [...pendingMediaFiles];
            closeMediaPreview();

            filesToSend.forEach(file => {
                const isVideo = file.type.startsWith('video/');
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('send-private-message', {
                        senderName: myName,
                        targetName: selectedTargetUser,
                        mediaType: isVideo ? 'video' : 'image',
                        mediaUrl: e.target.result,
                        isViewOnce: isViewOnce,
                        clientTime: clientTime
                    });
                };
                reader.readAsDataURL(file);
            });
        }

        async function openDirectCamera() {
            if(!selectedTargetUser) return alert('Select user first!');
            document.getElementById('cameraModal').style.display = 'flex';
            try {
                camStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: camFacing }, 
                    audio: false 
                });
                const camVid = document.getElementById('camPreview');
                camVid.srcObject = camStream;
                camVid.style.transform = (camFacing === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
            } catch (e) {
                alert('Camera Access Denied!');
                closeCamera();
            }
        }

        function closeCamera() {
            if(camStream) camStream.getTracks().forEach(t => t.stop());
            document.getElementById('cameraModal').style.display = 'none';
        }

        async function switchDirectCamera() {
            camFacing = camFacing === 'user' ? 'environment' : 'user';
            closeCamera();
            openDirectCamera();
        }

        function captureDirectPhoto() {
            const vid = document.getElementById('camPreview');
            const canvas = document.createElement('canvas');
            canvas.width = vid.videoWidth || 1280;
            canvas.height = vid.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            
            if(camFacing === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            closeCamera();

            fetch(dataUrl)
                .then(res => res.blob())
                .then(blob => {
                    const file = new File([blob], "camera_photo.jpg", { type: "image/jpeg" });
                    pendingMediaFiles = [file];
                    document.getElementById('viewOnceCheckbox').checked = false;
                    showMediaBatchPreview();
                });
        }

        async function toggleRecordAudio() {
            if(!selectedTargetUser) return alert('Select user first!');
            const btn = document.getElementById('voiceBtn');
            
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const clientTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('send-private-message', {
                                senderName: myName,
                                targetName: selectedTargetUser,
                                mediaType: 'audio',
                                mediaUrl: e.target.result,
                                isViewOnce: false,
                                clientTime: clientTime
                            });
                        };
                        reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.color = 'red';
                } catch(err) {
                    alert('Microphone Access Denied!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.color = 'var(--text-secondary)';
            }
        }

        function handleInputChange() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            const sendBtn = document.getElementById('sendBtn');
            const voiceBtn = document.getElementById('voiceBtn');

            if (txt.length > 0) {
                sendBtn.style.display = 'flex';
                voiceBtn.style.display = 'none';
            } else {
                sendBtn.style.display = 'none';
                voiceBtn.style.display = 'flex';
            }

            if(selectedTargetUser) {
                socket.emit('typing', { targetName: selectedTargetUser, isTyping: true });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('typing', { targetName: selectedTargetUser, isTyping: false });
                }, 2000);
            }
        }

        function toggleEmojiBox() {
            const box = document.getElementById('emojiBox');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function addEmoji(emoji) {
            const input = document.getElementById('msgInput');
            input.value += emoji;
            handleInputChange();
            document.getElementById('emojiBox').style.display = 'none';
        }

        function sendText() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if(!txt || !selectedTargetUser) return;
            
            const clientTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

            socket.emit('send-private-message', {
                senderName: myName,
                targetName: selectedTargetUser,
                message: txt,
                mediaType: 'text',
                isViewOnce: false,
                replyTo: activeReplyMsg ? `${activeReplyMsg.senderName}: ${activeReplyMsg.message || activeReplyMsg.mediaType}` : null,
                clientTime: clientTime
            });
            
            input.value = '';
            cancelReply();
            handleInputChange();
            socket.emit('typing', { targetName: selectedTargetUser, isTyping: false });
        }

        socket.on('user-typing-status', (data) => {
            if(selectedTargetUser === data.fromUser) {
                const statusElem = document.getElementById('targetStatusText');
                if (data.isTyping) {
                    statusElem.innerText = 'typing...';
                    statusElem.style.color = 'var(--accent-green)';
                } else {
                    statusElem.innerText = 'Online';
                    statusElem.style.color = 'var(--text-secondary)';
                }
            }
        });

        function closeMobileChat() { document.body.classList.remove('mobile-chat-open'); }

        function initWhiteboardEngine() {
            wbCanvas = document.getElementById('liveWhiteboard');
            wbCtx = wbCanvas.getContext('2d');
            resizeWbCanvas();
            window.addEventListener('resize', resizeWbCanvas);

            wbCanvas.addEventListener('mousedown', startWbDraw);
            wbCanvas.addEventListener('mousemove', drawWbStroke);
            wbCanvas.addEventListener('mouseup', stopWbDraw);
            wbCanvas.addEventListener('mouseleave', stopWbDraw);
            wbCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startWbDraw(e.touches[0]); }, { passive: false });
            wbCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawWbStroke(e.touches[0]); }, { passive: false });
            wbCanvas.addEventListener('touchend', (e) => { e.preventDefault(); stopWbDraw(); }, { passive: false });
        }

        function resizeWbCanvas() {
            if(!wbCanvas) return;
            const container = document.getElementById('wbCanvasContainer');
            const oldData = wbCanvas.toDataURL();
            wbCanvas.width = container.clientWidth;
            wbCanvas.height = container.clientHeight;
            const img = new Image();
            img.src = oldData;
            img.onload = () => { wbCtx.drawImage(img, 0, 0); };
        }

        function openWhiteboardModal() {
            if(!selectedTargetUser) return alert('Select a user to collaborate on Whiteboard!');
            document.getElementById('whiteboardModal').style.display = 'flex';
            document.getElementById('wbPartnerBadge').innerText = `Collaborating with: ${selectedTargetUser}`;
            setTimeout(resizeWbCanvas, 100);
        }

        function closeWhiteboardModal() { document.getElementById('whiteboardModal').style.display = 'none'; }
        function setWbTool(mode) {
            wbMode = mode;
            document.getElementById('wbPenBtn').classList.toggle('active', mode === 'pen');
            document.getElementById('wbEraserBtn').classList.toggle('active', mode === 'eraser');
        }

        function startWbDraw(e) {
            isDrawing = true;
            const rect = wbCanvas.getBoundingClientRect();
            lastX = (e.clientX || e.pageX) - rect.left;
            lastY = (e.clientY || e.pageY) - rect.top;
        }

        function drawWbStroke(e) {
            if(!isDrawing || !selectedTargetUser) return;
            const rect = wbCanvas.getBoundingClientRect();
            const currentX = (e.clientX || e.pageX) - rect.left;
            const currentY = (e.clientY || e.pageY) - rect.top;
            const color = document.getElementById('wbColorPicker').value;
            const size = document.getElementById('wbSizePicker').value;

            wbCtx.lineWidth = size;
            wbCtx.lineCap = 'round';
            wbCtx.lineJoin = 'round';

            if(wbMode === 'eraser') {
                wbCtx.strokeStyle = '#0b141a';
                wbCtx.lineWidth = size * 4;
            } else {
                wbCtx.strokeStyle = color;
            }

            wbCtx.beginPath();
            wbCtx.moveTo(lastX, lastY);
            wbCtx.lineTo(currentX, currentY);
            wbCtx.stroke();

            socket.emit('wb-draw-data', {
                targetName: selectedTargetUser,
                x0: lastX / wbCanvas.width,
                y0: lastY / wbCanvas.height,
                x1: currentX / wbCanvas.width,
                y1: currentY / wbCanvas.height,
                color: wbMode === 'eraser' ? '#0b141a' : color,
                size: wbMode === 'eraser' ? size * 4 : Number(size)
            });

            lastX = currentX;
            lastY = currentY;
        }

        function stopWbDraw() { isDrawing = false; }
        function clearWhiteboardLocal() {
            wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
            if(selectedTargetUser) socket.emit('wb-clear-data', { targetName: selectedTargetUser });
        }

        socket.on('wb-draw-receive', (data) => {
            if(selectedTargetUser === data.senderName && wbCanvas) {
                wbCtx.lineWidth = data.size;
                wbCtx.lineCap = 'round';
                wbCtx.lineJoin = 'round';
                wbCtx.strokeStyle = data.color;
                wbCtx.beginPath();
                wbCtx.moveTo(data.x0 * wbCanvas.width, data.y0 * wbCanvas.height);
                wbCtx.lineTo(data.x1 * wbCanvas.width, data.y1 * wbCanvas.height);
                wbCtx.stroke();
            }
        });

        socket.on('wb-clear-receive', (data) => {
            if(selectedTargetUser === data.senderName && wbCanvas) {
                wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
            }
        });

        async function getHDMediaStream(video, facing) {
            return await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000, channelCount: 1 },
                video: video ? { width: { ideal: 1280, max: 1280 }, height: { ideal: 720, max: 720 }, frameRate: { ideal: 24, max: 30 }, facingMode: facing } : false
            });
        }

        function initDraggablePip() {
            const pip = document.getElementById('pipVideo');
            let isDragging = false, startX, startY, initialX, initialY, hasMoved = false;

            const onStart = (e) => {
                isDragging = true;
                hasMoved = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX; startY = clientY;
                const rect = pip.getBoundingClientRect();
                initialX = rect.left; initialY = rect.top;
            };

            const onMove = (e) => {
                if(!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - startX, dy = clientY - startY;
                if(Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
                pip.style.left = `${initialX + dx}px`;
                pip.style.top = `${initialY + dy}px`;
                pip.style.right = 'auto';
            };

            const onEnd = () => {
                if(!hasMoved) swapVideoViews();
                isDragging = false;
            };

            pip.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            pip.addEventListener('touchstart', onStart, {passive: true});
            document.addEventListener('touchmove', onMove, {passive: true});
            document.addEventListener('touchend', onEnd);
        }

        function updatePipMirrorStyle() {
            const pip = document.getElementById('pipVideo');
            if (currentFacingMode === 'user') {
                pip.classList.add('mirror-self');
                pip.classList.remove('no-mirror');
            } else {
                pip.classList.add('no-mirror');
                pip.classList.remove('mirror-self');
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            iceCandidateQueue = [];

            peerConnection.ontrack = (e) => {
                if (e.streams && e.streams[0]) {
                    remoteStream = e.streams[0];
                    assignStreamViews();
                }
            };

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('ice-candidate', { targetName: selectedTargetUser, candidate: e.candidate });
                }
            };

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }
        }

        async function processIceQueue() {
            while (iceCandidateQueue.length > 0) {
                const candidate = iceCandidateQueue.shift();
                try { await peerConnection.addIceCandidate(candidate); } catch (err) {}
            }
        }

        async function startCall(videoMode) {
            if(!selectedTargetUser) return alert('Select user to call!');
            isVideoCall = videoMode;
            isMainVideoRemote = true;

            const clientTimeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
            socket.emit('send-private-message', {
                senderName: myName,
                targetName: selectedTargetUser,
                message: isVideoCall ? 'Outgoing Video Call' : 'Outgoing Voice Call',
                mediaType: 'call_log',
                clientTime: clientTimeStr
            });

            document.getElementById('callModal').style.display = 'flex';
            document.getElementById('callTargetName').innerText = selectedTargetUser;
            document.getElementById('callStatusText').innerText = 'Calling...';
            document.getElementById('incomingSlideCard').style.display = 'none';
            document.getElementById('activeCallControls').style.display = 'flex';

            try {
                localStream = await getHDMediaStream(isVideoCall, currentFacingMode);
                updatePipMirrorStyle();
                assignStreamViews();
                createPeerConnection();

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call-user', { targetName: selectedTargetUser, offer, isVideo: isVideoCall });
            } catch (err) {
                alert('Could not start call.');
                endCallUI();
            }
        }

        socket.on('incoming-call', async (data) => {
            incomingOffer = data.offer;
            isVideoCall = data.isVideo;
            selectedTargetUser = data.fromUser;
            
            document.getElementById('callModal').style.display = 'flex';
            document.getElementById('callTargetName').innerText = data.fromUser;
            document.getElementById('callStatusText').innerText = isVideoCall ? 'Incoming Video Call...' : 'Incoming Voice Call...';
            document.getElementById('incomingCallerName').innerText = data.fromUser;
            document.getElementById('incomingCallType').innerText = isVideoCall ? 'Incoming Video Call' : 'Incoming Voice Call';
            document.getElementById('incomingSlideCard').style.display = 'block';
            document.getElementById('activeCallControls').style.display = 'none';
            
            socket.emit('call-ringing', { targetName: data.fromUser });
        });

        socket.on('call-ringing-received', () => {
            document.getElementById('callStatusText').innerText = 'Ringing...';
        });

        async function acceptCall() {
            document.getElementById('incomingSlideCard').style.display = 'none';
            document.getElementById('activeCallControls').style.display = 'flex';
            document.getElementById('callStatusText').innerText = 'Connected';

            try {
                localStream = await getHDMediaStream(isVideoCall, currentFacingMode);
                updatePipMirrorStyle();
                assignStreamViews();
                createPeerConnection();

                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
                await processIceQueue();

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('answer-call', { targetName: selectedTargetUser, answer });

                document.getElementById('mainVideo').play().catch(e => {});
                document.getElementById('pipVideo').play().catch(e => {});
            } catch (err) {
                alert('Call connection failed');
                endCall();
            }
        }

        socket.on('call-accepted', async (data) => {
            document.getElementById('callStatusText').innerText = 'Connected';
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                await processIceQueue();
            }
        });

        socket.on('ice-candidate', async (data) => {
            const candidate = new RTCIceCandidate(data.candidate);
            if (peerConnection && peerConnection.remoteDescription) {
                await peerConnection.addIceCandidate(candidate);
            } else {
                iceCandidateQueue.push(candidate);
            }
        });

        socket.on('call-ended', () => endCallUI());

        function assignStreamViews() {
            const mainVid = document.getElementById('mainVideo');
            const pipVid = document.getElementById('pipVideo');

            if (isMainVideoRemote) {
                mainVid.srcObject = remoteStream || null;
                pipVid.srcObject = localStream || null;
            } else {
                mainVid.srcObject = localStream || null;
                pipVid.srcObject = remoteStream || null;
            }
        }

        function swapVideoViews() { 
            isMainVideoRemote = !isMainVideoRemote; 
            assignStreamViews(); 
        }

        async function switchCamera() {
            if (!isVideoCall || !localStream) return;
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            
            localStream.getVideoTracks().forEach(track => track.stop());
            
            try {
                const newStream = await getHDMediaStream(true, currentFacingMode);
                const newVideoTrack = newStream.getVideoTracks()[0];
                
                localStream.removeTrack(localStream.getVideoTracks()[0]);
                localStream.addTrack(newVideoTrack);

                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(newVideoTrack);
                }
                updatePipMirrorStyle();
                assignStreamViews();
            } catch(e) {}
        }

        function promptScreenShare() {
            document.getElementById('screenShareConfirmModal').style.display = 'flex';
        }

        async function closeScreenShareConfirm(confirmed) {
            document.getElementById('screenShareConfirmModal').style.display = 'none';
            if (confirmed) {
                await executeScreenShare();
            }
        }

        async function executeScreenShare() {
            if (!peerConnection) return;
            if (!isScreenSharing) {
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const screenTrack = screenStream.getVideoTracks()[0];
                    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(screenTrack);
                    
                    document.getElementById('mainVideo').srcObject = screenStream;
                    isScreenSharing = true;

                    screenTrack.onended = () => { stopScreenSharing(); };
                } catch(err) {}
            } else {
                stopScreenSharing();
            }
        }

        function stopScreenSharing() {
            if (!isScreenSharing) return;
            const videoTrack = localStream.getVideoTracks()[0];
            const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender && videoTrack) sender.replaceTrack(videoTrack);
            assignStreamViews();
            isScreenSharing = false;
        }

        function toggleMuteMic() {
            if (localStream && localStream.getAudioTracks().length > 0) {
                isMicMuted = !isMicMuted;
                localStream.getAudioTracks()[0].enabled = !isMicMuted;
                document.getElementById('btnMuteMic').innerText = isMicMuted ? '🔇' : '🎙';
            }
        }

        function endCall() {
            if(selectedTargetUser) socket.emit('end-call', { targetName: selectedTargetUser });
            endCallUI();
        }

        function endCallUI() {
            if(peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            remoteStream = null;
            isScreenSharing = false;
            isMicMuted = false;
            document.getElementById('btnMuteMic').innerText = '🎙';
            document.getElementById('callModal').style.display = 'none';
        }

        function enableZoom(containerId, videoId) {
            const container = document.getElementById(containerId);
            const video = document.getElementById(videoId);
            let scale = 1;
            let startDist = 0;

            if(!container || !video) return;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    startDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, {passive: true});

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    let dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    let factor = dist / startDist;
                    scale = Math.min(Math.max(1, scale * factor), 4);
                    currentZoomScale = scale;
                    
                    let mirrorProp = (videoId === 'pipVideo' && currentFacingMode === 'user') ? 'scaleX(-1) ' : '';
                    video.style.transform = mirrorProp + `scale(${scale})`;
                    startDist = dist;

                    if (selectedTargetUser && videoId === 'mainVideo') {
                        socket.emit('video-zoom-sync', { targetName: selectedTargetUser, zoomScale: scale });
                    }
                }
            }, {passive: true});
        }

        socket.on('video-zoom-receive', (data) => {
            const mainVid = document.getElementById('mainVideo');
            if (mainVid && data.zoomScale) {
                mainVid.style.transform = `scale(${data.zoomScale})`;
            }
        });
    </script>
