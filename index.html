<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Messenger • Live Chat & Call</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-panel: #111b21;
            --wa-header: #202c33;
            --wa-green: #00a884;
            --wa-bubble-sent: #005c4b;
            --wa-bubble-recv: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--wa-bg); color: var(--text-primary); height: 100vh; display: flex; }

        .app-container { width: 100vw; height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar - Online Users List */
        .sidebar { width: 320px; background: var(--wa-panel); border-right: 1px solid #222d34; display: flex; flex-direction: column; }
        .sidebar-header { height: 60px; background: var(--wa-header); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        .login-box { padding: 12px; border-bottom: 1px solid #222d34; }
        .input-box { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #2a3942; color: #fff; outline: none; margin-bottom: 8px; }
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .user-item:hover, .user-item.active { background: #202c33; }
        .online-dot { width: 10px; height: 10px; background: var(--wa-green); border-radius: 50%; }

        /* Chat Window */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; }
        .chat-header { height: 60px; background: var(--wa-header); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
        .call-btns { display: flex; gap: 15px; font-size: 1.3rem; cursor: pointer; }

        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; }
        .msg.sent { align-self: flex-end; background: var(--wa-bubble-sent); }
        .msg.recv { align-self: flex-start; background: var(--wa-bubble-recv); }
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 5px; }

        /* Input Bar */
        .chat-input { height: 62px; background: var(--wa-header); padding: 10px; display: flex; align-items: center; gap: 10px; }
        .btn-icon { background: none; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; }

        /* Call Screen Popup */
        .call-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:100; }
        .video-box { display: flex; gap: 20px; margin-bottom: 20px; }
        video { width: 280px; height: 210px; background: #222; border-radius: 12px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <strong style="color:var(--wa-green)">Quantum WhatsApp</strong>
            </div>
            <div class="login-box">
                <input type="text" id="myUsername" class="input-box" placeholder="Your Name">
                <button onclick="register()" style="width:100%; padding:10px; background:var(--wa-green); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Set Profile Name</button>
            </div>
            <div style="padding:10px; font-size:0.85rem; color:var(--text-secondary);">ONLINE USERS:</div>
            <div class="user-list" id="usersContainer"></div>
        </div>

        <!-- Chat Main Area -->
        <div class="chat-main">
            <div class="chat-header">
                <div>
                    <strong id="targetUserName">Select a user to chat</strong>
                    <div id="targetStatus" style="font-size:0.75rem; color:var(--text-secondary);">Offline</div>
                </div>
                <div class="call-btns" id="callBtns" style="display:none;">
                    <span onclick="startCall('audio')">📞</span>
                    <span onclick="startCall('video')">📹</span>
                </div>
            </div>

            <div class="chat-body" id="chatWin"></div>

            <div class="chat-input">
                <button class="btn-icon" onclick="addEmoji('😊')">😊</button>
                <button class="btn-icon" onclick="document.getElementById('imgInput').click()">📎</button>
                <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendPhoto(this)">
                <input type="text" id="msgText" class="input-box" style="margin:0; flex:1;" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendText()">
                <button class="btn-icon" style="color:var(--wa-green);" onclick="sendText()">➔</button>
            </div>
        </div>
    </div>

    <!-- Call Overlay -->
    <div class="call-screen" id="callScreen">
        <h3 id="callTitle" style="margin-bottom:15px; color:#fff;">Calling...</h3>
        <div class="video-box">
            <video id="localVideo" autoplay muted></video>
            <video id="remoteVideo" autoplay></video>
        </div>
        <div style="display:flex; gap:15px;">
            <button id="acceptBtn" onclick="acceptCall()" style="display:none; padding:10px 20px; background:var(--wa-green); color:#fff; border:none; border-radius:20px; font-weight:bold; cursor:pointer;">Accept Call</button>
            <button onclick="endCall()" style="padding:10px 20px; background:red; color:#fff; border:none; border-radius:20px; font-weight:bold; cursor:pointer;">End Call</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = '';
        let selectedTargetSocketId = null;
        let localStream = null;
        let incomingCallData = null;

        function register() {
            myName = document.getElementById('myUsername').value.trim();
            if(!myName) return alert('Enter your name first!');
            socket.emit('register-user', { username: myName });
            alert('Registered as: ' + myName);
        }

        socket.on('update-user-list', (users) => {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '';
            users.forEach(u => {
                if(u.socketId !== socket.id) {
                    const div = document.createElement('div');
                    div.className = `user-item ${selectedTargetSocketId === u.socketId ? 'active' : ''}`;
                    div.innerHTML = `<span>${u.username}</span><div class="online-dot"></div>`;
                    div.onclick = () => selectUser(u.socketId, u.username);
                    container.appendChild(div);
                }
            });
        });

        function selectUser(targetId, targetName) {
            selectedTargetSocketId = targetId;
            document.getElementById('targetUserName').innerText = targetName;
            document.getElementById('targetStatus').innerText = 'Online';
            document.getElementById('targetStatus').style.color = 'var(--wa-green)';
            document.getElementById('callBtns').style.display = 'flex';
        }

        function sendText() {
            const txt = document.getElementById('msgText').value.trim();
            if(!txt || !selectedTargetSocketId) return alert('Select a user and type a message!');
            
            socket.emit('send-private-message', {
                targetSocketId: selectedTargetSocketId,
                message: txt,
                senderName: myName,
                mediaType: 'text'
            });

            renderMsg({ senderName: 'You', message: txt, mediaType: 'text' }, true);
            document.getElementById('msgText').value = '';
        }

        function sendPhoto(input) {
            if (input.files && input.files[0] && selectedTargetSocketId) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    socket.emit('send-private-message', {
                        targetSocketId: selectedTargetSocketId,
                        senderName: myName,
                        mediaType: 'image',
                        mediaUrl: e.target.result
                    });
                    renderMsg({ senderName: 'You', mediaType: 'image', mediaUrl: e.target.result }, true);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addEmoji(e) {
            document.getElementById('msgText').value += e;
        }

        socket.on('receive-private-message', (data) => {
            renderMsg(data, false);
        });

        function renderMsg(data, isMe) {
            const win = document.getElementById('chatWin');
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'sent' : 'recv'}`;
            
            if(data.mediaType === 'text') {
                div.innerHTML = `<strong>${isMe ? 'You' : data.senderName}:</strong><br>${data.message}`;
            } else if(data.mediaType === 'image') {
                div.innerHTML = `<strong>${isMe ? 'You' : data.senderName}:</strong><br><img src="${data.mediaUrl}">`;
            }
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        // Voice / Video Call Functions
        async function startCall(type) {
            if(!selectedTargetSocketId) return alert('Select a user to call!');
            document.getElementById('callScreen').style.display = 'flex';
            document.getElementById('callTitle').innerText = `Calling ${type.toUpperCase()}...`;
            document.getElementById('acceptBtn').style.display = 'none';

            localStream = await navigator.mediaDevices.getUserMedia({
                video: type === 'video',
                audio: true
            });
            document.getElementById('localVideo').srcObject = localStream;

            socket.emit('initiate-call', {
                targetSocketId: selectedTargetSocketId,
                callType: type,
                callerName: myName
            });
        }

        socket.on('incoming-call', (data) => {
            incomingCallData = data;
            document.getElementById('callScreen').style.display = 'flex';
            document.getElementById('callTitle').innerText = `${data.callerName} is calling (${data.callType.toUpperCase()})...`;
            document.getElementById('acceptBtn').style.display = 'block';
        });

        async function acceptCall() {
            if(!incomingCallData) return;
            localStream = await navigator.mediaDevices.getUserMedia({
                video: incomingCallData.callType === 'video',
                audio: true
            });
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('acceptBtn').style.display = 'none';
            document.getElementById('callTitle').innerText = 'Connected Call';
        }

        function endCall() {
            document.getElementById('callScreen').style.display = 'none';
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if(selectedTargetSocketId) {
                socket.emit('end-call', { targetSocketId: selectedTargetSocketId });
            }
        }

        socket.on('call-ended', () => {
            alert('Call Ended');
            endCall();
        });
    </script>
</body>
</html>
