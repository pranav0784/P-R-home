<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-panel: #111b21;
            --wa-header: #202c33;
            --wa-accent: #00a884;
            --wa-sent: #005c4b;
            --wa-recv: #202c33;
            --wa-text: #e9edef;
            --wa-subtext: #8696a0;
            --wa-border: #222d34;
            --wa-input-bg: #2a3942;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; background: var(--wa-bg); color: var(--wa-text); overflow: hidden; }

        /* Login Screen */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--wa-bg); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-card { background: var(--wa-panel); padding: 35px 30px; border-radius: 12px; width: 90%; max-width: 360px; text-align: center; border: 1px solid var(--wa-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-card h2 { color: var(--wa-accent); margin-bottom: 22px; font-weight: 500; font-size: 1.8rem; }
        .auth-card input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--wa-border); background: var(--wa-input-bg); color: #fff; margin-bottom: 15px; outline: none; font-size: 0.95rem; }
        .auth-card button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--wa-accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .auth-card button:hover { background: #019575; }

        .app-container { width: 100vw; height: 100dvh; display: none; flex-direction: row; overflow: hidden; }

        /* Sidebar / Chat List */
        .sidebar { width: 400px; background: var(--wa-panel); border-right: 1px solid var(--wa-border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { height: 60px; background: var(--wa-header); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        .wa-profile-area { display: flex; align-items: center; gap: 12px; }
        .my-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; }
        .header-icons { display: flex; gap: 20px; color: var(--wa-subtext); font-size: 1.25rem; align-items: center; }

        /* Meta AI & Search Bar */
        .wa-search-container { padding: 8px 12px; background: var(--wa-panel); border-bottom: 1px solid var(--wa-border); }
        .wa-search-box { width: 100%; background: var(--wa-header); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; color: var(--wa-subtext); }
        .wa-search-box input { background: none; border: none; outline: none; color: var(--wa-text); width: 100%; font-size: 0.9rem; }

        /* Filter Pills (All, Unread, Favourites, Groups) */
        .filter-pills { padding: 8px 12px; display: flex; gap: 8px; background: var(--wa-panel); overflow-x: auto; white-space: nowrap; }
        .filter-pill { background: var(--wa-header); color: var(--wa-subtext); padding: 6px 12px; border-radius: 16px; font-size: 0.82rem; cursor: pointer; font-weight: 500; }
        .filter-pill.active { background: rgba(0, 168, 132, 0.15); color: var(--wa-accent); }

        .user-list { flex: 1; overflow-y: auto; background: var(--wa-panel); }
        .user-item { padding: 10px 16px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02); transition: background 0.15s; }
        .user-item:hover, .user-item.active { background: #202c33; }
        .user-item img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        .user-info { flex: 1; min-width: 0; }
        .user-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .user-info strong { font-size: 1rem; color: var(--wa-text); font-weight: 400; }
        .user-info span { font-size: 0.75rem; color: var(--wa-subtext); }
        .last-msg { font-size: 0.85rem; color: var(--wa-subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Floating Action Button (New Chat Icon like WhatsApp) */
        .fab-btn { position: fixed; bottom: 25px; right: 25px; width: 56px; height: 56px; background: var(--wa-accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; z-index: 100; display: none; }

        /* Chat Main Screen */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100dvh; min-width: 0; position: relative; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
        .chat-header { height: 60px; background: var(--wa-header); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-left: 1px solid var(--wa-border); flex-shrink: 0; }
        .target-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .target-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .chat-header-actions { display: flex; gap: 24px; color: var(--wa-subtext); font-size: 1.2rem; align-items: center; }

        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

        .msg { max-width: 65%; padding: 6px 10px 8px 10px; border-radius: 7.5px; font-size: 0.92rem; word-break: break-word; position: relative; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .msg.sent { align-self: flex-end; background: var(--wa-sent); border-top-right-radius: 0; }
        .msg.recv { align-self: flex-start; background: var(--wa-recv); border-top-left-radius: 0; }
        .msg img, .msg video { max-width: 100%; border-radius: 6px; margin-top: 4px; max-height: 250px; cursor: pointer; }
        .msg audio { max-width: 100%; margin-top: 4px; }
        
        .time-ticks { font-size: 0.65rem; color: var(--wa-subtext); text-align: right; margin-top: 2px; float: right; margin-left: 10px; display: flex; align-items: center; gap: 2px; }
        .blue-ticks { color: #53bdeb; font-weight: bold; }

        /* Exact WhatsApp Chat Footer Bar */
        .chat-input-area { height: 62px; background: var(--wa-header); padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
        .wa-input-box { flex: 1; background: var(--wa-input-bg); border-radius: 8px; padding: 10px 14px; border: none; color: #fff; outline: none; font-size: 0.95rem; }
        .action-icon { background: none; border: none; color: var(--wa-subtext); font-size: 1.35rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .action-icon:hover { color: var(--wa-text); }

        /* Call Modal Screen */
        #callModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 3000; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
        .call-card { background: var(--wa-panel); padding: 25px; border-radius: 18px; text-align: center; border: 1px solid var(--wa-border); width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .call-video-box { width: 100%; height: 240px; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-top: 12px; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 85px; height: 110px; object-fit: cover; position: absolute; bottom: 10px; right: 10px; border-radius: 8px; border: 2px solid var(--wa-accent); }
        .call-btns { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .btn-accept { background: var(--wa-accent); border: none; padding: 10px 24px; border-radius: 24px; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-reject { background: #ff5252; border: none; padding: 10px 24px; border-radius: 24px; color: #fff; font-weight: bold; cursor: pointer; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; display: flex; }
            .chat-main { display: none; width: 100%; }
            .mobile-chat-open .sidebar { display: none !important; }
            .mobile-chat-open .chat-main { display: flex !important; }
            #backBtn { display: inline-block !important; }
        }
    </style>
</head>
<body>

    <!-- Auth / Login Screen -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>WhatsApp Web</h2>
            <input type="text" id="inputName" placeholder="Enter your name">
            <input type="text" id="inputAvatar" placeholder="Avatar URL (Optional)">
            <button onclick="login()">Start Messaging</button>
        </div>
    </div>

    <!-- Call Screen Modal -->
    <div id="callModal">
        <div class="call-card">
            <h3 id="callStatusText" style="color:var(--wa-text);">Calling...</h3>
            <div id="callerNameText" style="color:var(--wa-subtext); font-size:0.9rem; margin-top:4px;">User</div>
            <div class="call-video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="call-btns">
                <button class="btn-accept" id="acceptCallBtn" onclick="acceptCall()">Accept</button>
                <button class="btn-reject" onclick="endCall()">End</button>
            </div>
        </div>
    </div>

    <!-- Main WhatsApp Interface -->
    <div class="app-container" id="appContainer">
        
        <!-- Sidebar Chat List -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="wa-profile-area">
                    <img id="myAvatarImg" src="" class="my-avatar" title="Your Profile">
                    <span id="myUsernameText" style="font-weight: 500; font-size: 1.05rem;"></span>
                </div>
                <div class="header-icons">
                    <span title="Status">⭕</span>
                    <span title="New Chat">💬</span>
                    <span title="Menu">⋮</span>
                </div>
            </div>

            <div class="wa-search-container">
                <div class="wa-search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search or start new chat">
                </div>
            </div>

            <div class="filter-pills">
                <div class="filter-pill active">All</div>
                <div class="filter-pill">Unread</div>
                <div class="filter-pill">Favourites</div>
                <div class="filter-pill">Groups</div>
            </div>

            <div class="user-list" id="userListContainer"></div>
        </div>

        <!-- Chat Window -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="target-profile">
                    <button class="action-icon" onclick="closeMobileChat()" style="display:none; margin-right:4px;" id="backBtn">⬅</button>
                    <img id="targetAvatarImg" src="" class="target-avatar">
                    <div>
                        <strong id="targetNameText" style="font-weight: 400; font-size: 1.05rem;">Select a chat</strong>
                        <div id="targetStatusText" style="font-size:0.75rem; color:var(--wa-subtext);">online</div>
                    </div>
                </div>
                
                <div class="chat-header-actions">
                    <span onclick="startCall(true)" title="Video Call" style="cursor:pointer;">📹</span>
                    <span onclick="startCall(false)" title="Voice Call" style="cursor:pointer;">📞</span>
                    <span title="Menu" style="cursor:pointer;">⋮</span>
                </div>
            </div>

            <div class="chat-body" id="chatWin"></div>

            <!-- Exact WhatsApp Bottom Footer Bar (Emoji, Attach, Rupee UPI, Camera, Mic) -->
            <div class="chat-input-area">
                <button class="action-icon" title="Emoji">😊</button>
                <button class="action-icon" title="Attach" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="sendMedia(this)">
                
                <button class="action-icon" title="Payments">₹</button>
                <button class="action-icon" title="Camera" onclick="document.getElementById('fileInput').click()">📷</button>

                <input type="text" id="msgInput" class="wa-input-box" placeholder="Type a message" oninput="handleInputChange()" onkeydown="if(event.key==='Enter') sendText()">
                
                <button class="action-icon" id="voiceBtn" onclick="toggleRecordAudio()" title="Voice Message">🎙</button>
                <button class="action-icon" id="sendBtn" style="color:var(--wa-accent); display:none;" onclick="sendText()" title="Send">➤</button>
            </div>
        </div>
    </div>

    <audio id="remoteAudio" autoplay style="display:none;"></audio>

    <script>
        const socket = io();
        let myName = '', selectedTargetUser = null, allHistory = [];
        let mediaRecorder = null, audioChunks = [], isRecording = false;
        let peerConnection = null, localStream = null, incomingOffer = null, isVideoCall = false;
        let typingTimeout = null;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        window.onload = () => {
            const savedName = localStorage.getItem('wa_username');
            if(savedName) document.getElementById('inputName').value = savedName;
        };

        function login() {
            myName = document.getElementById('inputName').value.trim();
            const avatar = document.getElementById('inputAvatar').value.trim();
            if(!myName) return alert('Name is required!');

            localStorage.setItem('wa_username', myName);
            socket.emit('login-attempt', { username: myName, avatarUrl: avatar });
        }

        socket.on('login-success', (data) => {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('myUsernameText').innerText = data.username;
            document.getElementById('myAvatarImg').src = data.avatarUrl;
        });

        socket.on('update-user-list', (users) => {
            const container = document.getElementById('userListContainer');
            container.innerHTML = '';

            users.forEach(u => {
                if(u.username !== myName) {
                    const div = document.createElement('div');
                    div.className = `user-item ${selectedTargetUser === u.username ? 'active' : ''}`;
                    const statusText = u.isOnline ? 'online' : (u.lastSeen || 'offline');
                    
                    div.innerHTML = `
                        <img src="${u.avatarUrl}">
                        <div class="user-info">
                            <div class="user-info-top">
                                <strong>${u.username}</strong>
                                <span>10:45 AM</span>
                            </div>
                            <div class="last-msg">${statusText}</div>
                        </div>
                    `;
                    div.onclick = () => selectTargetUser(u);
                    container.appendChild(div);
                }
            });
        });

        function selectTargetUser(userObj) {
            selectedTargetUser = userObj.username;
            document.getElementById('targetNameText').innerText = userObj.username;
            document.getElementById('targetAvatarImg').src = userObj.avatarUrl;
            document.getElementById('targetStatusText').innerText = userObj.isOnline ? 'online' : (userObj.lastSeen || 'offline');
            document.body.classList.add('mobile-chat-open');
            renderFilteredHistory();
        }

        socket.on('load-chat-history', (history) => {
            allHistory = history;
            if(selectedTargetUser) renderFilteredHistory();
        });

        socket.on('receive-private-message', (msgObj) => {
            allHistory.push(msgObj);
            if(selectedTargetUser === msgObj.senderName || msgObj.senderName === myName) {
                renderFilteredHistory();
            }
        });

        function renderFilteredHistory() {
            const win = document.getElementById('chatWin');
            win.innerHTML = '';
            
            const conversation = allHistory.filter(m => 
                (m.senderName === myName && m.targetName === selectedTargetUser) ||
                (m.senderName === selectedTargetUser && m.targetName === myName)
            );

            conversation.forEach(msg => {
                const isMe = msg.senderName === myName;
                const div = document.createElement('div');
                div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                
                let html = '';
                if(msg.mediaType === 'text') html += msg.message;
                else if(msg.mediaType === 'image') html += `<img src="${msg.mediaUrl}">`;
                else if(msg.mediaType === 'video') html += `<video src="${msg.mediaUrl}" controls></video>`;
                else if(msg.mediaType === 'audio') html += `<audio src="${msg.mediaUrl}" controls></audio>`;
                
                html += `<div class="time-ticks"><span>${msg.time}</span> ${isMe ? '<span class="blue-ticks">✓✓</span>' : ''}</div>`;
                div.innerHTML = html;
                win.appendChild(div);
            });

            win.scrollTop = win.scrollHeight;
        }

        function handleInputChange() {
            const txt = document.getElementById('msgInput').value.trim();
            const sendBtn = document.getElementById('sendBtn');
            const voiceBtn = document.getElementById('voiceBtn');

            if (txt.length > 0) {
                sendBtn.style.display = 'flex';
                voiceBtn.style.display = 'none';
            } else {
                sendBtn.style.display = 'none';
                voiceBtn.style.display = 'flex';
            }

            if(selectedTargetUser) {
                socket.emit('typing', { targetName: selectedTargetUser, isTyping: true });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('typing', { targetName: selectedTargetUser, isTyping: false });
                }, 2000);
            }
        }

        socket.on('user-typing-status', (data) => {
            if(selectedTargetUser === data.fromUser) {
                document.getElementById('targetStatusText').innerText = data.isTyping ? 'typing...' : 'online';
                document.getElementById('targetStatusText').style.color = data.isTyping ? 'var(--wa-accent)' : 'var(--wa-subtext)';
            }
        });

        function sendText() {
            const txt = document.getElementById('msgInput').value.trim();
            if(!txt || !selectedTargetUser) return;
            
            socket.emit('send-private-message', {
                senderName: myName,
                targetName: selectedTargetUser,
                message: txt,
                mediaType: 'text'
            });
            
            document.getElementById('msgInput').value = '';
            handleInputChange();
        }

        function sendMedia(input) {
            if(input.files && input.files[0] && selectedTargetUser) {
                const file = input.files[0];
                const isVideo = file.type.startsWith('video/');
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('send-private-message', {
                        senderName: myName,
                        targetName: selectedTargetUser,
                        mediaType: isVideo ? 'video' : 'image',
                        mediaUrl: e.target.result
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        async function toggleRecordAudio() {
            if(!selectedTargetUser) return alert('Select chat first!');
            const btn = document.getElementById('voiceBtn');
            
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('send-private-message', {
                                senderName: myName,
                                targetName: selectedTargetUser,
                                mediaType: 'audio',
                                mediaUrl: e.target.result
                            });
                        };
                        reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.color = '#ff5252';
                } catch(err) {
                    alert('Mic permission error');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.color = 'var(--wa-subtext)';
            }
        }

        function closeMobileChat() { document.body.classList.remove('mobile-chat-open'); }

        async function startCall(videoMode) {
            if(!selectedTargetUser) return;
            isVideoCall = videoMode;
            document.getElementById('callModal').style.display = 'flex';
            document.getElementById('callStatusText').innerText = isVideoCall ? 'Video calling...' : 'Calling...';
            document.getElementById('callerNameText').innerText = selectedTargetUser;
            document.getElementById('acceptCallBtn').style.display = 'none';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
                document.getElementById('localVideo').srcObject = isVideoCall ? localStream : null;
                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = e => {
                    if(isVideoCall) document.getElementById('remoteVideo').srcObject = e.streams[0];
                    else document.getElementById('remoteAudio').srcObject = e.streams[0];
                };

                peerConnection.onicecandidate = e => {
                    if(e.candidate) socket.emit('ice-candidate', { targetName: selectedTargetUser, candidate: e.candidate });
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call-user', { targetName: selectedTargetUser, offer, isVideo: isVideoCall });
            } catch(err) {
                endCallUI();
            }
        }

        socket.on('incoming-call', async (data) => {
            incomingOffer = data.offer;
            isVideoCall = data.isVideo;
            selectedTargetUser = data.fromUser;
            document.getElementById('callModal').style.display = 'flex';
            document.getElementById('callStatusText').innerText = isVideoCall ? 'Incoming video call' : 'Incoming voice call';
            document.getElementById('callerNameText').innerText = data.fromUser;
            document.getElementById('acceptCallBtn').style.display = 'inline-block';
        });

        async function acceptCall() {
            document.getElementById('acceptCallBtn').style.display = 'none';
            document.getElementById('callStatusText').innerText = 'Connected';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
                document.getElementById('localVideo').srcObject = isVideoCall ? localStream : null;
                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = e => {
                    if(isVideoCall) document.getElementById('remoteVideo').srcObject = e.streams[0];
                    else document.getElementById('remoteAudio').srcObject = e.streams[0];
                };

                peerConnection.onicecandidate = e => {
                    if(e.candidate) socket.emit('ice-candidate', { targetName: selectedTargetUser, candidate: e.candidate });
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('answer-call', { targetName: selectedTargetUser, answer });
            } catch(err) {
                endCallUI();
            }
        }

        socket.on('call-accepted', async (data) => {
            document.getElementById('callStatusText').innerText = 'Connected';
            if(peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', async (data) => {
            if(peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        });

        socket.on('call-ended', () => endCallUI());

        function endCall() {
            if(selectedTargetUser) socket.emit('end-call', { targetName: selectedTargetUser });
            endCallUI();
        }

        function endCallUI() {
            if(peerConnection) peerConnection.close();
            if(localStream) localStream.getTracks().forEach(track => track.stop());
            peerConnection = null;
            localStream = null;
            document.getElementById('callModal').style.display = 'none';
        }
    </script>
</body>
</html>
